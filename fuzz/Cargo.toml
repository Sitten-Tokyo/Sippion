[package]
name = "sippion-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
sippion = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "query_normalize"
path = "fuzz_targets/query_normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redaction"
path = "fuzz_targets/redaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_policy"
path = "fuzz_targets/path_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "syntax_parse"
path = "fuzz_targets/syntax_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_json"
path = "fuzz_targets/mcp_json.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
