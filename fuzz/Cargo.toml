[package]
name = "sippion-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sippion = { path = ".." }

[[bin]]
name = "query_normalize"
path = "fuzz_targets/query_normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redaction"
path = "fuzz_targets/redaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "root_scope"
path = "fuzz_targets/root_scope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_stdio"
path = "fuzz_targets/mcp_stdio.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_parser"
path = "fuzz_targets/source_parser.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
