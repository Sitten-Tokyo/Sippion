name: Temporary second-audit patch commit

on:
  push:
    branches:
      - fix/close-second-audit-gaps

permissions:
  contents: write

concurrency:
  group: second-audit-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit:
    if: github.repository == 'Sitten-Tokyo/Sippion' && github.event.head_commit.message == 'Commit validated non-workflow hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Prepare deterministic patch edge cases
        run: python3 scripts/post_audit_patch_fixup.py

      - name: Apply deterministic hardening patch
        run: python3 scripts/apply_post_audit_hardening.py

      - name: Apply generated-test fixups
        run: python3 scripts/post_audit_patch_fixup.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt

      - name: Resolve lockfile and compile
        run: cargo check

      - name: Format Rust sources
        run: cargo fmt

      - name: Keep workflow mutations for connector-only commit
        run: git checkout HEAD -- .github/workflows/author-auto-merge.yml .github/workflows/ci.yml

      - name: Remove temporary patch drivers from final tree
        run: rm scripts/apply_post_audit_hardening.py scripts/post_audit_patch_fixup.py

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit validated non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply validated non-workflow hardening"
          git push origin HEAD:fix/close-second-audit-gaps
