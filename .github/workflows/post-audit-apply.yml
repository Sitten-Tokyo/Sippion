name: Temporary second-audit patch export

on:
  push:
    branches:
      - fix/close-second-audit-gaps

permissions:
  contents: read

concurrency:
  group: second-audit-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: github.repository == 'Sitten-Tokyo/Sippion'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare deterministic patch edge cases
        run: python3 scripts/post_audit_patch_fixup.py

      - name: Apply deterministic hardening patch
        run: python3 scripts/apply_post_audit_hardening.py

      - name: Apply generated-test fixups
        run: python3 scripts/post_audit_patch_fixup.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt

      - name: Resolve lockfile and compile
        run: cargo check

      - name: Format Rust sources
        run: cargo fmt

      - name: Reject whitespace errors
        run: git diff --check

      - name: Package persistent patch files
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary HEAD > second-audit.patch
          tar -czf second-audit-files.tgz \
            Cargo.toml \
            Cargo.lock \
            deny.toml \
            .github/workflows/author-auto-merge.yml \
            .github/workflows/ci.yml \
            scripts/check-bootstrap-pins.py \
            src/core.rs \
            src/hybrid.rs \
            src/repo.rs \
            src/repo/access.rs \
            src/repo/policy.rs \
            src/repo/ranking.rs \
            src/repo/tests.rs \
            src/service.rs \
            tests/post_audit_regressions.rs

      - name: Upload generated patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: second-audit-generated-files
          path: |
            second-audit.patch
            second-audit-files.tgz
          if-no-files-found: error
          retention-days: 1
