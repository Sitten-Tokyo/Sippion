name: Apply language SBOM OSS improvements

on:
  push:
    branches:
      - feature/language-sbom-oss
    paths:
      - .github/workflows/apply-language-sbom-oss.yml
      - scripts/apply_language_sbom_oss.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/language-sbom-oss

      - name: Normalize patch driver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_language_sbom_oss.py")
          text = path.read_text()
          text = text.replace("'''          release-assets/install.sh", "'''            release-assets/install.sh")
          text = text.replace("\n          release-assets/install.ps1\n'''", "\n            release-assets/install.ps1\n'''")
          text = text.replace("\n          release-assets/sippion.cdx.json\n'''", "\n            release-assets/sippion.cdx.json\n'''")
          text = text.replace("\n        for binary in \\\n", "\n          for binary in \\\n")
          text = text.replace("\n        gh attestation verify \"published/sippion.cdx.json\"", "\n          gh attestation verify \"published/sippion.cdx.json\"")
          path.write_text(text)
          PY

      - name: Apply deterministic feature patch
        run: python scripts/apply_language_sbom_oss.py

      - name: Preserve rc.35 verifier compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/release-supply-chain-smoke.yml")
          text = path.read_text()
          release_ref = "$" + "{{ steps.release.outputs.tag }}"
          event_ref = "$" + "{{ github.event_name }}"
          text = text.replace(
              f"        env:\n          RELEASE_TAG: {release_ref}\n        shell: bash\n",
              f"        env:\n          RELEASE_TAG: {release_ref}\n          EVENT_NAME: {event_ref}\n        shell: bash\n",
              1,
          )
          text = text.replace(
              "            sippion.cdx.json\n            sippion.cdx.json.sha256\n",
              "",
              1,
          )
          text = text.replace(
              "          )\n          for asset in \"${expected[@]}\"; do\n",
              "          )\n          if [ \"$EVENT_NAME\" = \"release\" ] || [ \"$EVENT_NAME\" = \"workflow_run\" ]; then\n            expected+=(sippion.cdx.json sippion.cdx.json.sha256)\n          fi\n          for asset in \"${expected[@]}\"; do\n",
              1,
          )
          text = text.replace("            sippion.cdx.json.sha256 \\\n", "", 1)
          text = text.replace(
              "          done\n\n      - name: Verify every published provenance attestation\n",
              "          done\n          if [ -f sippion.cdx.json.sha256 ]; then\n            sha256sum -c sippion.cdx.json.sha256\n          fi\n\n      - name: Verify every published provenance attestation\n",
              1,
          )
          text = text.replace(
              "          gh attestation verify \"published/sippion.cdx.json\" \\\n          --repo \"$REPOSITORY\" \\\n          --signer-workflow \"$REPOSITORY/.github/workflows/release-draft.yml\" \\\n          --source-digest \"$RELEASE_SHA\" >/dev/null\n",
              "        if [ -f published/sippion.cdx.json ]; then\n          gh attestation verify \"published/sippion.cdx.json\" \\\n            --repo \"$REPOSITORY\" \\\n            --signer-workflow \"$REPOSITORY/.github/workflows/release-draft.yml\" \\\n            --source-digest \"$RELEASE_SHA\" >/dev/null\n        fi\n",
              1,
          )
          path.write_text(text)
          PY

      - name: Format and validate Rust changes
        run: |
          cargo fmt
          cargo check --locked
          cargo test --locked

      - name: Commit feature patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/syntax.rs README.md docs/architecture.md docs/integrations.md THIRD_PARTY_NOTICES.md \
            .github/workflows/release-draft.yml .github/workflows/release-supply-chain-smoke.yml \
            .github/workflows/author-auto-merge.yml CONTRIBUTING.md CHANGELOG.md SECURITY.md
          git commit -m "Expand language support and release transparency"
          git push origin HEAD:feature/language-sbom-oss
