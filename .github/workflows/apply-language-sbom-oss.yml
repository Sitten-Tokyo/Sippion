name: Apply language SBOM OSS improvements

on:
  push:
    branches:
      - feature/language-sbom-oss
    paths:
      - .github/workflows/apply-language-sbom-oss.yml
      - scripts/apply_language_sbom_oss.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/language-sbom-oss

      - name: Normalize patch driver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_language_sbom_oss.py")
          text = path.read_text()
          text = text.replace("'''          release-assets/install.sh", "'''            release-assets/install.sh")
          text = text.replace("\n          release-assets/install.ps1\n'''", "\n            release-assets/install.ps1\n'''")
          text = text.replace("\n          release-assets/sippion.cdx.json\n'''", "\n            release-assets/sippion.cdx.json\n'''")
          text = text.replace("\n        for binary in ", "\n          for binary in ")
          text = text.replace("\n        gh attestation verify \"published/sippion.cdx.json\"", "\n          gh attestation verify \"published/sippion.cdx.json\"")
          normalized = []
          for line in text.splitlines():
              if "let source =" in line and "auth/session.h" in line:
                  line = r'        let source = r#"#include "auth/session.h"\nint login(void) { return validate_token(); }\n"#;'
              normalized.append(line)
          path.write_text("\n".join(normalized) + "\n")
          PY

      - name: Apply deterministic feature patch
        run: python scripts/apply_language_sbom_oss.py

      - name: Preserve rc.35 verifier compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/release-supply-chain-smoke.yml")
          lines = path.read_text().splitlines()
          out = []
          in_expected = False
          in_checksum = False
          skip_sbom_attestation = 0
          inserted_event = False
          inserted_conditional = False
          inserted_optional_checksum = False
          event_expr = "$" + "{{ github.event_name }}"
          for line in lines:
              stripped = line.strip()
              if skip_sbom_attestation:
                  skip_sbom_attestation -= 1
                  continue
              if 'gh attestation verify "published/sippion.cdx.json"' in line:
                  out.extend([
                      "        if [ -f published/sippion.cdx.json ]; then",
                      "          gh attestation verify \"published/sippion.cdx.json\" \\",
                      "            --repo \"$REPOSITORY\" \\",
                      "            --signer-workflow \"$REPOSITORY/.github/workflows/release-draft.yml\" \\",
                      "            --source-digest \"$RELEASE_SHA\" >/dev/null",
                      "        fi",
                  ])
                  skip_sbom_attestation = 3
                  continue
              if stripped == "expected=(":
                  in_expected = True
              elif in_expected and stripped == ")":
                  in_expected = False
              if in_expected and stripped in {"sippion.cdx.json", "sippion.cdx.json.sha256"}:
                  continue
              if stripped == "- name: Verify every published checksum":
                  in_checksum = True
              elif stripped == "- name: Verify every published provenance attestation":
                  if not inserted_optional_checksum:
                      out.extend([
                          "          if [ -f sippion.cdx.json.sha256 ]; then",
                          "            sha256sum -c sippion.cdx.json.sha256",
                          "          fi",
                          "",
                      ])
                      inserted_optional_checksum = True
                  in_checksum = False
              if in_checksum and stripped.startswith("sippion.cdx.json.sha256"):
                  continue
              out.append(line)
              if stripped.startswith("RELEASE_TAG:") and not inserted_event:
                  out.append(f"          EVENT_NAME: {event_expr}")
                  inserted_event = True
              if stripped == ")" and not in_expected and not inserted_conditional and any("expected=(" in previous for previous in out[-30:]):
                  out.extend([
                      "          if [ \"$EVENT_NAME\" = \"release\" ] || [ \"$EVENT_NAME\" = \"workflow_run\" ]; then",
                      "            expected+=(sippion.cdx.json sippion.cdx.json.sha256)",
                      "          fi",
                  ])
                  inserted_conditional = True
          if not all([inserted_event, inserted_conditional, inserted_optional_checksum]):
              raise SystemExit("failed to apply SBOM compatibility transformation")
          path.write_text("\n".join(out) + "\n")
          PY

      - name: Format and validate Rust changes
        run: |
          cargo fmt
          cargo check --locked
          cargo test --locked

      - name: Commit feature patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/syntax.rs README.md docs/architecture.md docs/integrations.md THIRD_PARTY_NOTICES.md \
            .github/workflows/release-draft.yml .github/workflows/release-supply-chain-smoke.yml \
            .github/workflows/author-auto-merge.yml CONTRIBUTING.md CHANGELOG.md SECURITY.md
          git commit -m "Expand language support and release transparency"
          git push origin HEAD:feature/language-sbom-oss
