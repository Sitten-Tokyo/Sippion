name: Debug context holdout

on:
  push:
    branches:
      - feature/context-efficiency-overhaul

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/context-efficiency-overhaul
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
      - run: cargo build --release --locked
      - name: Query failing holdout cases
        shell: bash
        run: |
          set -euo pipefail
          holdout_root="$RUNNER_TEMP/sippion-debug-holdout"
          mkdir -p "$holdout_root"
          tar --exclude='./.git' --exclude='./target' --exclude='./eval' --exclude='./node_modules' --exclude='./.github/scripts/final-context-quality.py' --exclude='./.github/scripts/apply-final-context-quality.py' --exclude='./.github/workflows/final-context-quality.yml' --exclude='./.github/workflows/debug-source-prior.yml' -cf - . | tar -xf - -C "$holdout_root"
          python3 - "$holdout_root" <<'PY'
          import json, subprocess, sys
          root=sys.argv[1]
          queries=[
            ('source-prior','coding source prior ranking implementation','src/repo/ranking.rs','coding_source_prior'),
            ('semantic-import-neighbor','semantic import expansion neighbor','src/repo/map.rs','semantic_expansion_paths'),
            ('context-budget','adaptive context budget confidence ambiguity','src/core.rs','adaptive_context_budget'),
            ('context-packer','pack context utility token atom','src/service/context.rs','pack_context'),
          ]
          for name, query, path, anchor in queries:
              proc=subprocess.run(['target/release/sippion','query','--root',root,'--json','--',query],text=True,capture_output=True,check=True)
              payload=json.loads(proc.stdout)
              print(f'=== {name} ===')
              print('RANKED', [(x['path'],round(x['rank'],2)) for x in payload['diagnostics']['ranked_files']])
              print('PACKED', payload['diagnostics'].get('packed_paths'))
              print('ANCHOR_PRESENT', anchor in payload['context'])
              print('TARGET_RECORDS')
              lines=payload['context'].splitlines()
              active=False
              for line in lines:
                  if line.startswith(('S path=','E path=')):
                      active=(f'path="{path}"' in line)
                  if active:
                      print(line)
          PY
