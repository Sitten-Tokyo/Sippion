name: Debug source prior

on:
  push:
    branches:
      - feature/context-efficiency-overhaul

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/context-efficiency-overhaul
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
      - run: cargo build --release --locked
      - name: Query source prior
        shell: bash
        run: |
          set -euo pipefail
          holdout_root="$RUNNER_TEMP/sippion-debug-holdout"
          mkdir -p "$holdout_root"
          tar --exclude='./.git' --exclude='./target' --exclude='./eval' --exclude='./node_modules' --exclude='./.github/scripts/final-context-quality.py' --exclude='./.github/scripts/apply-final-context-quality.py' --exclude='./.github/workflows/final-context-quality.yml' --exclude='./.github/workflows/debug-source-prior.yml' -cf - . | tar -xf - -C "$holdout_root"
          target/release/sippion query --root "$holdout_root" --json -- "coding source prior ranking implementation" | tee "$RUNNER_TEMP/query.json"
          python3 - "$RUNNER_TEMP/query.json" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], encoding='utf-8'))
          print('RANKED')
          for entry in payload['diagnostics']['ranked_files']:
              print(entry)
          print('PACKED', payload['diagnostics'].get('packed_paths'))
          PY
