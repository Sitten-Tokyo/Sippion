name: Real Codex efficiency pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    name: Run pinned 240-execution Codex pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Actions credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY Actions secret is required for the real pilot." >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy

      - name: Build Sippion
        run: cargo build --release --locked

      - name: Run real Codex pilot
        run: |
          python3 eval/efficiency/run_pilot.py \
            --runs 5 \
            --output eval/efficiency/results.jsonl \
            --sippion-binary target/release/sippion

      - name: Score pilot
        if: always() && hashFiles('eval/efficiency/results.jsonl') != ''
        run: python3 eval/efficiency/score.py eval/efficiency/results.jsonl --format json | tee eval/efficiency/score.json

      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: efficiency-pilot-${{ github.run_id }}
          path: |
            eval/efficiency/results.jsonl
            eval/efficiency/score.json
          if-no-files-found: warn
