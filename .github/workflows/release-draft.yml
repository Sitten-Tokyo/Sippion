name: Build draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.1.0-rc.30
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build draft release artifacts
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ inputs.tag }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  draft-release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Validate release tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 2
          fi

      - name: Check out tagged installer sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sippion-*
          path: downloaded
          merge-multiple: false

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          : > release-assets/SHA256SUMS
          for directory in downloaded/*; do
            for file in "$directory"/*; do
              case "$(basename "$file")" in
                SHA256SUMS) cat "$file" >> release-assets/SHA256SUMS ;;
                *) cp "$file" release-assets/ ;;
              esac
            done
          done
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1
          (
            cd release-assets
            sha256sum install.sh > install.sh.sha256
            sha256sum install.ps1 > install.ps1.sha256
            cat install.sh.sha256 install.ps1.sha256 >> SHA256SUMS
          )
          test -n "$(find release-assets -type f -name 'sippion-*' -print -quit)"
          test -s release-assets/SHA256SUMS

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-assets/install.sh
            release-assets/install.ps1

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Sippion $RELEASE_TAG" \
            --notes "Draft release created manually. Review the four platform binaries, installers, checksums, and GitHub artifact attestations before publishing." \
            release-assets/*
