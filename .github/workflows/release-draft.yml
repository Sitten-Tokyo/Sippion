name: Build draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build; dispatch this workflow from the same tag ref
        required: true
        type: string
  push:
    branches:
      - 'release/v*'

permissions:
  contents: read

jobs:
  prepare-release:
    name: Validate and resolve release target
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate and resolve release target
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag() {
            local release_tag=$1
            local ref_endpoint="repos/$REPOSITORY/git/ref/tags/$release_tag"
            local object_type
            local object_sha
            object_type=$(gh api "$ref_endpoint" --jq '.object.type')
            object_sha=$(gh api "$ref_endpoint" --jq '.object.sha')
            while [ "$object_type" = "tag" ]; do
              local tag_endpoint="repos/$REPOSITORY/git/tags/$object_sha"
              object_type=$(gh api "$tag_endpoint" --jq '.object.type')
              object_sha=$(gh api "$tag_endpoint" --jq '.object.sha')
            done
            if [ "$object_type" != "commit" ] || ! [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release tag $release_tag does not resolve to a commit SHA." >&2
              return 2
            fi
            printf '%s\n' "$object_sha"
          }

          if [ "$EVENT_NAME" = "push" ]; then
            case "$REF_NAME" in
              release/v*) release_tag=${REF_NAME#release/} ;;
              *) echo "Unexpected release trigger branch: $REF_NAME" >&2; exit 2 ;;
            esac
          else
            release_tag=$INPUT_TAG
          fi

          if ! [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 2
          fi

          expected_version=${release_tag#v}
          manifest_version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [ "$manifest_version" != "$expected_version" ]; then
            echo "Cargo.toml version $manifest_version does not match release tag $release_tag." >&2
            exit 2
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            main_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$CURRENT_SHA" != "$main_sha" ]; then
              echo "Release branch must point exactly at current main ($main_sha), got $CURRENT_SHA." >&2
              exit 2
            fi

            if gh api "repos/$REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              resolved_sha=$(resolve_tag "$release_tag")
              if [ "$resolved_sha" != "$CURRENT_SHA" ]; then
                echo "Existing tag $release_tag points to $resolved_sha, expected $CURRENT_SHA." >&2
                exit 2
              fi
            else
              gh api --method POST "repos/$REPOSITORY/git/refs" \
                -f ref="refs/tags/$release_tag" \
                -f sha="$CURRENT_SHA" >/dev/null
              resolved_sha=$(resolve_tag "$release_tag")
            fi
          else
            resolved_sha=$(resolve_tag "$release_tag")
            # Artifact attestations identify the workflow invocation's source
            # commit. Refuse to build an arbitrary tag from a workflow run rooted
            # at some other branch/commit, or provenance would name the wrong
            # source. In the Actions UI select the release tag as the run ref.
            if [ "$CURRENT_SHA" != "$resolved_sha" ]; then
              echo "Manual release must be dispatched from tag $release_tag itself: tag resolves to $resolved_sha but workflow source is $CURRENT_SHA." >&2
              exit 2
            fi
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build release artifacts
    needs: prepare-release
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.prepare-release.outputs.sha }}
      attest: true
    permissions:
      contents: read
      id-token: write
      attestations: write

  draft-release:
    name: Create draft release
    needs: [prepare-release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged installer sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout matches attested release source
        env:
          EXPECTED_SHA: ${{ needs.prepare-release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sippion-*
          path: downloaded
          merge-multiple: false

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          : > release-assets/SHA256SUMS
          for directory in downloaded/*; do
            for file in "$directory"/*; do
              case "$(basename "$file")" in
                SHA256SUMS) cat "$file" >> release-assets/SHA256SUMS ;;
                *) cp "$file" release-assets/ ;;
              esac
            done
          done
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1
          (
            cd release-assets
            sha256sum install.sh > install.sh.sha256
            sha256sum install.ps1 > install.ps1.sha256
            cat install.sh.sha256 install.ps1.sha256 >> SHA256SUMS
          )
          test -n "$(find release-assets -type f -name 'sippion-*' -print -quit)"
          test -s release-assets/SHA256SUMS

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/install.sh
            release-assets/install.ps1

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 2
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Sippion $RELEASE_TAG" \
            release-assets/*

  publish-release:
    name: Publish branch-triggered pre-release
    if: github.event_name == 'push'
    needs: [prepare-release, draft-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --draft=false \
            --prerelease

      - name: Delete one-shot release branch
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$REF_NAME" || true
