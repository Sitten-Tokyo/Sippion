name: Build draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; dispatch this workflow using that same tag ref
        required: true
        type: string
  push:
    branches:
      - 'release/v*'

permissions:
  contents: read

jobs:
  prepare-release:
    name: Validate and resolve release target
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release candidate without materializing a tag
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag() {
            local release_tag=$1
            local object_type object_sha
            object_type=$(gh api "repos/$REPOSITORY/git/ref/tags/$release_tag" --jq '.object.type')
            object_sha=$(gh api "repos/$REPOSITORY/git/ref/tags/$release_tag" --jq '.object.sha')
            while [ "$object_type" = "tag" ]; do
              object_type=$(gh api "repos/$REPOSITORY/git/tags/$object_sha" --jq '.object.type')
              object_sha=$(gh api "repos/$REPOSITORY/git/tags/$object_sha" --jq '.object.sha')
            done
            if [ "$object_type" != "commit" ] || ! [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release tag $release_tag does not resolve to a commit SHA." >&2
              return 2
            fi
            printf '%s\n' "$object_sha"
          }

          if [ "$EVENT_NAME" = "push" ]; then
            case "$REF_NAME" in
              release/v*) release_tag=${REF_NAME#release/} ;;
              *) echo "Unexpected release trigger branch: $REF_NAME" >&2; exit 2 ;;
            esac
          else
            release_tag=$INPUT_TAG
          fi

          if ! [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 2
          fi

          expected_version=${release_tag#v}
          manifest_version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [ "$manifest_version" != "$expected_version" ]; then
            echo "Cargo.toml version $manifest_version does not match release tag $release_tag." >&2
            exit 2
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            main_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$CURRENT_SHA" != "$main_sha" ]; then
              echo "Release branch must point exactly at current main ($main_sha), got $CURRENT_SHA." >&2
              exit 2
            fi
            if gh api "repos/$REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              echo "Release tag $release_tag already exists; branch-triggered releases require a fresh tag." >&2
              exit 2
            fi
            resolved_sha=$CURRENT_SHA
          else
            resolved_sha=$(resolve_tag "$release_tag")
            if [ "$CURRENT_SHA" != "$resolved_sha" ]; then
              echo "Manual release must be dispatched on exact tag ref $release_tag ($resolved_sha), got $CURRENT_SHA." >&2
              exit 2
            fi
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build release artifacts
    needs: prepare-release
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.prepare-release.outputs.sha }}
      attest: true
    permissions:
      contents: read
      id-token: write
      attestations: write

  draft-release:
    name: Create draft release
    needs: [prepare-release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false

      - name: Set up pinned Node.js for MCPB tooling
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'

      - name: Install pinned SBOM generator
        run: cargo install cargo-cyclonedx --version '=0.5.9' --locked

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --override-filename sippion.cdx
          test -s sippion.cdx.json
          jq -e '.bomFormat == "CycloneDX" and .metadata.component.name == "sippion"' sippion.cdx.json >/dev/null

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sippion-*
          path: downloaded
          merge-multiple: false

      - name: Build and validate per-platform MCPB packages
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          mkdir -p release-assets mcpb-work mcpb-raw
          python3 scripts/prepare-mcpb.py --binary downloaded/sippion-linux-x86_64/sippion-linux-x86_64 --platform linux --version "$version" --output-dir mcpb-work/linux
          python3 scripts/prepare-mcpb.py --binary downloaded/sippion-windows-x86_64.exe/sippion-windows-x86_64.exe --platform win32 --version "$version" --output-dir mcpb-work/windows
          python3 scripts/prepare-mcpb.py --binary downloaded/sippion-macos-aarch64/sippion-macos-aarch64 --platform darwin --version "$version" --output-dir mcpb-work/macos-aarch64
          python3 scripts/prepare-mcpb.py --binary downloaded/sippion-macos-x86_64/sippion-macos-x86_64 --platform darwin --version "$version" --output-dir mcpb-work/macos-x86_64
          for spec in \
            'linux:sippion-linux-x86_64.mcpb' \
            'windows:sippion-windows-x86_64.mcpb' \
            'macos-aarch64:sippion-macos-aarch64.mcpb' \
            'macos-x86_64:sippion-macos-x86_64.mcpb'; do
            dir=${spec%%:*}
            file=${spec#*:}
            npx --yes @anthropic-ai/mcpb@2.1.2 validate "mcpb-work/$dir"
            npx --yes @anthropic-ai/mcpb@2.1.2 pack "mcpb-work/$dir" "mcpb-raw/$file"
            python3 scripts/canonicalize-mcpb.py --input "mcpb-raw/$file" --output "release-assets/$file"
            npx --yes @anthropic-ai/mcpb@2.1.2 info "release-assets/$file" >/dev/null
            test -s "release-assets/$file"
          done
          python3 scripts/generate-server-json.py --assets-dir release-assets --tag "$RELEASE_TAG" --version "$version" --output release-assets/server.json
          test -s release-assets/server.json

      - name: Validate generated Official MCP Registry metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher validate release-assets/server.json

      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp sippion.cdx.json release-assets/sippion.cdx.json
          : > release-assets/SHA256SUMS
          for directory in downloaded/*; do
            for file in "$directory"/*; do
              case "$(basename "$file")" in
                SHA256SUMS) cat "$file" >> release-assets/SHA256SUMS ;;
                *) cp "$file" release-assets/ ;;
              esac
            done
          done
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1
          (
            cd release-assets
            sha256sum install.sh > install.sh.sha256
            sha256sum install.ps1 > install.ps1.sha256
            sha256sum sippion.cdx.json > sippion.cdx.json.sha256
            sha256sum server.json > server.json.sha256
            for bundle in *.mcpb; do
              sha256sum "$bundle" > "$bundle.sha256"
            done
            cat install.sh.sha256 install.ps1.sha256 sippion.cdx.json.sha256 server.json.sha256 *.mcpb.sha256 >> SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          for artifact in \
            sippion-linux-x86_64 \
            sippion-windows-x86_64.exe \
            sippion-macos-aarch64 \
            sippion-macos-x86_64; do
            test -s "release-assets/$artifact"
            test -s "release-assets/$artifact.sha256"
          done
          test -s release-assets/sippion.cdx.json
          test -s release-assets/sippion.cdx.json.sha256
          test -s release-assets/server.json
          test -s release-assets/server.json.sha256
          for bundle in release-assets/*.mcpb; do
            test -s "$bundle"
            test -s "$bundle.sha256"
          done

      - name: Attest installer, SBOM, MCPB, and registry metadata provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/install.sh
            release-assets/install.ps1
            release-assets/sippion.cdx.json
            release-assets/server.json
            release-assets/sippion-linux-x86_64.mcpb
            release-assets/sippion-windows-x86_64.mcpb
            release-assets/sippion-macos-aarch64.mcpb
            release-assets/sippion-macos-x86_64.mcpb

      - name: Materialize tag and create draft release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 2
          fi

          tag_created=0
          cleanup_failure() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$tag_created" -eq 1 ]; then
              echo "Release creation failed after tag creation; removing partial release/tag." >&2
              gh release delete "$RELEASE_TAG" --repo "$REPOSITORY" --yes >/dev/null 2>&1 || true
              gh api --method DELETE "repos/$REPOSITORY/git/refs/tags/$RELEASE_TAG" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup_failure EXIT

          if [ "$EVENT_NAME" = "push" ]; then
            current_main=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$current_main" != "$RELEASE_SHA" ]; then
              echo "main advanced during release build: expected $RELEASE_SHA, now $current_main." >&2
              exit 2
            fi
            if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Tag $RELEASE_TAG appeared during release build." >&2
              exit 2
            fi
            gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$RELEASE_SHA" >/dev/null
            tag_created=1
          else
            resolved=$(gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
            if [ "$resolved" != "$RELEASE_SHA" ]; then
              echo "Manual release tag moved: $resolved != $RELEASE_SHA." >&2
              exit 2
            fi
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Sippion $RELEASE_TAG" \
            release-assets/*

          trap - EXIT

  publish-release:
    name: Publish branch-triggered pre-release
    if: github.event_name == 'push'
    needs: [prepare-release, draft-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --draft=false \
            --prerelease

      - name: Delete one-shot release branch
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$REF_NAME" || true
