name: Build draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.1.0-rc.30
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build draft release artifacts
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ inputs.tag }}
    permissions:
      contents: read

  draft-release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sippion-*
          path: downloaded
          merge-multiple: false

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          : > release-assets/SHA256SUMS
          for directory in downloaded/*; do
            for file in "$directory"/*; do
              case "$(basename "$file")" in
                SHA256SUMS) cat "$file" >> release-assets/SHA256SUMS ;;
                *) cp "$file" release-assets/ ;;
              esac
            done
          done
          test -n "$(find release-assets -type f -name 'sippion-*' -print -quit)"
          test -s release-assets/SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --draft \
            --title "Sippion ${{ inputs.tag }}" \
            --notes "Draft release created manually. Review the four platform binaries and checksums, then publish it from GitHub when approved." \
            release-assets/*
