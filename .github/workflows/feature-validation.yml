name: Finalize self-hosted evaluation CI

on:
  push:
    branches:
      - feature/context-efficiency-overhaul

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/context-efficiency-overhaul
          persist-credentials: true

      - name: Make permanent CI self-evaluation source-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - name: Run self-hosted token efficiency evaluation
        if: runner.os == 'Linux'
        run: |
          python3 scripts/retrieval-eval.py \\
            --binary target/release/sippion \\
            --cases eval/self_cases.json \\
            --fixture . \\
            --baseline-root .
'''
          new = '''      - name: Run self-hosted token efficiency evaluation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          self_root="$RUNNER_TEMP/sippion-self-eval"
          rm -rf "$self_root"
          mkdir -p "$self_root"
          cp -R src "$self_root/src"
          python3 scripts/retrieval-eval.py \\
            --binary target/release/sippion \\
            --cases eval/self_cases.json \\
            --fixture "$self_root" \\
            --baseline-root "$self_root"
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('permanent self-eval CI anchor not found')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then
            echo "Permanent CI already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Isolate permanent self-hosted token evaluation"
          git push origin HEAD:feature/context-efficiency-overhaul
