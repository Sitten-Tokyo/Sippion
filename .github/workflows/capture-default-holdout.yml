name: Capture default holdout

on:
  push:
    branches:
      - feature/context-efficiency-overhaul

permissions:
  contents: write

jobs:
  holdout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/context-efficiency-overhaul
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
        with:
          toolchain: 1.85.0
      - name: Build release binary
        run: cargo build --release --locked
      - name: Evaluate untouched defaults on independent holdout
        run: |
          set -euo pipefail
          holdout_root="$RUNNER_TEMP/sippion-default-holdout"
          rm -rf "$holdout_root"
          mkdir -p "$holdout_root"
          tar --exclude='./.git' --exclude='./target' --exclude='./eval' --exclude='./node_modules' --exclude='./.github/context-tuning-result.json' -cf - . | tar -xf - -C "$holdout_root"
          set +e
          python3 scripts/retrieval-eval.py \
            --binary target/release/sippion \
            --cases eval/self_holdout_cases.json \
            --fixture "$holdout_root" \
            --baseline-root "$holdout_root" \
            > .github/default-holdout-result.json
          status=$?
          set -e
          python3 -m json.tool .github/default-holdout-result.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.github/default-holdout-result.json')
          data = json.loads(p.read_text())
          data['evaluationExitCode'] = int(__import__('os').environ.get('EVAL_STATUS', '0'))
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          echo "holdout evaluator exit=$status"
        env:
          EVAL_STATUS: "0"
      - name: Commit result and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/capture-default-holdout.yml
          git add .github/default-holdout-result.json
          git commit -m "Capture default holdout result"
          git push origin HEAD:feature/context-efficiency-overhaul
