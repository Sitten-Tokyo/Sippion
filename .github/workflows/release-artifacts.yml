name: Build release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build release artifacts
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ github.sha }}
      attest: true
    permissions:
      contents: read
      id-token: write
      attestations: write
