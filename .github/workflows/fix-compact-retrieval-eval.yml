name: Apply compact retrieval eval fix

on:
  push:
    branches:
      - feat/efficiency-layer
    paths:
      - '.github/scripts/fix-compact-retrieval-eval.py'
      - '.github/workflows/fix-compact-retrieval-eval.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/efficiency-layer
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0

      - name: Apply parser compatibility patch
        run: python3 .github/scripts/fix-compact-retrieval-eval.py

      - name: Validate targeted regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/retrieval-eval.py
          cargo build --release --locked
          python3 scripts/retrieval-eval.py --binary target/release/sippion

      - name: Commit verified fix and remove migration files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/retrieval-eval.py
          git rm .github/scripts/fix-compact-retrieval-eval.py .github/workflows/fix-compact-retrieval-eval.yml
          git commit -m 'fix: parse compact context in retrieval eval'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${BRANCH}"
