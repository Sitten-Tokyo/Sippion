name: Fix syntax clippy duplicate

on:
  push:
    branches:
      - feature/language-sbom-oss
    paths:
      - .github/workflows/fix-syntax-clippy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/language-sbom-oss

      - name: Remove duplicate function_definition match
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("src/syntax.rs")
          lines = path.read_text().splitlines()
          removed = 0
          out = []
          for line in lines:
              if line.strip() == '| "function_definition"':
                  removed += 1
                  continue
              out.append(line)
          if removed != 1:
              raise SystemExit(f"expected exactly one duplicate line, removed={removed}")
          path.write_text("\n".join(out) + "\n")
          PY
          cargo fmt --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/syntax.rs
          git commit -m "Remove duplicate syntax match"
          git push origin HEAD:feature/language-sbom-oss
