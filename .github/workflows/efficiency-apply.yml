name: Apply efficiency integration

on:
  push:
    branches:
      - feat/efficiency-layer
    paths:
      - .github/workflows/efficiency-apply.yml
      - .github/scripts/apply-efficiency.py
      - .github/scripts/fix-efficiency-tests.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/efficiency-layer
          persist-credentials: false

      - name: Install Rust tools
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
        with:
          components: rustfmt, clippy

      - name: Apply patch
        run: |
          python3 .github/scripts/apply-efficiency.py
          python3 .github/scripts/fix-efficiency-tests.py

      - name: Verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit verified integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/efficiency-apply.yml
          rm -f .github/scripts/apply-efficiency.py .github/scripts/fix-efficiency-tests.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate efficiency rule and OpenCode setup"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:feat/efficiency-layer
