name: Performance regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'eval/**'
      - 'scripts/perf-regression.py'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false

      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: baseline
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0

      - name: Build baseline
        run: cargo build --release --locked --manifest-path baseline/Cargo.toml

      - name: Build candidate
        run: cargo build --release --locked --manifest-path candidate/Cargo.toml

      - name: Validate benchmark tooling syntax
        run: python3 -m py_compile candidate/scripts/perf-regression.py

      - name: Compare candidate against baseline
        run: |
          python3 candidate/scripts/perf-regression.py \
            --baseline baseline/target/release/sippion \
            --candidate candidate/target/release/sippion \
            --fixture candidate/eval/fixture \
            --cases candidate/eval/cases.json \
            --repetitions 2
