name: Temporary rc36 version bump

on:
  push:
    branches:
      - release-prep/v0.1.0-rc.36

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release prep branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-prep/v0.1.0-rc.36
          fetch-depth: 0

      - name: Bump manifest and lockfile version
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/version = "0.1.0-rc.35"/version = "0.1.0-rc.36"/' Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Cargo.lock')
          text = path.read_text()
          old = 'name = "sippion"\nversion = "0.1.0-rc.35"'
          new = 'name = "sippion"\nversion = "0.1.0-rc.36"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one root package version, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo check --locked
          git diff --check

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m 'Bump version to 0.1.0-rc.36'
          git push origin HEAD:release-prep/v0.1.0-rc.36
