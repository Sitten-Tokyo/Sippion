name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-refactor-13:
    name: One-shot repository module split
    if: github.ref_name == 'refactor/repo-modules-13' || github.head_ref == 'refactor/repo-modules-13'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/repo-modules-13
          persist-credentials: true

      - name: Generate focused repository modules
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^mod access;$' src/repo.rs && test -f src/repo/access.rs; then
            echo 'Repository engine is already split.'
            exit 0
          fi
          python3 scripts/repo_refactor_13.py
          cargo fmt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/repo.rs src/repo
          git commit -m 'refactor: split repository engine into focused modules'
          git push origin HEAD:refactor/repo-modules-13

  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Windows x86_64 MSVC
            runner: windows-2025
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy

      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: sh
        run: |
          sh -n scripts/bootstrap.sh
          sh -n scripts/install.sh

      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @("scripts/bootstrap.ps1", "scripts/install.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  security-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Audit Cargo.lock against RustSec
        run: cargo audit --file Cargo.lock
