name: CI

on:
  push:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Windows x86_64 MSVC
            runner: windows-2025
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate README bootstrap pins
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-bootstrap-pins.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy

      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: sh
        run: |
          sh -n scripts/bootstrap.sh
          sh -n scripts/install.sh

      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @("scripts/bootstrap.ps1", "scripts/install.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run retrieval quality and context budget evaluation
        if: runner.os == 'Linux'
        run: python3 scripts/retrieval-eval.py --binary target/release/sippion

      - name: Set up pinned Node.js for official MCP client and MCPB tooling
        if: runner.os == 'Linux'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'

      - name: Install exact official MCP client
        if: runner.os == 'Linux'
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @modelcontextprotocol/client@2.0.0

      - name: Run external MCP protocol conformance
        if: runner.os == 'Linux'
        run: node scripts/mcp-conformance.mjs target/release/sippion eval/fixture

      - name: Verify deterministic MCPB packaging
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          rm -rf /tmp/sippion-mcpb-repro
          mkdir -p /tmp/sippion-mcpb-repro
          for pass in first second; do
            python3 scripts/prepare-mcpb.py \
              --binary target/release/sippion \
              --platform linux \
              --version "$version" \
              --output-dir "/tmp/sippion-mcpb-repro/$pass"
            npx --yes @anthropic-ai/mcpb@2.1.2 validate "/tmp/sippion-mcpb-repro/$pass"
            npx --yes @anthropic-ai/mcpb@2.1.2 pack \
              "/tmp/sippion-mcpb-repro/$pass" \
              "/tmp/sippion-mcpb-repro/$pass.raw.mcpb"
            python3 scripts/canonicalize-mcpb.py \
              --input "/tmp/sippion-mcpb-repro/$pass.raw.mcpb" \
              --output "/tmp/sippion-mcpb-repro/$pass.mcpb"
            npx --yes @anthropic-ai/mcpb@2.1.2 info "/tmp/sippion-mcpb-repro/$pass.mcpb" >/dev/null
          done
          sha256sum /tmp/sippion-mcpb-repro/first.mcpb /tmp/sippion-mcpb-repro/second.mcpb
          cmp /tmp/sippion-mcpb-repro/first.mcpb /tmp/sippion-mcpb-repro/second.mcpb

  pr-binding:
    name: Bind PR base/head for auto-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record tested PR base/head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'base=%s\nhead=%s\n' "$BASE_SHA" "$HEAD_SHA" > ci-binding.txt

      - name: Upload base/head binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-binding-${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
          path: ci-binding.txt
          if-no-files-found: error
          retention-days: 1

  security-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Audit Cargo.lock against RustSec
        run: cargo audit --file Cargo.lock

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.18.3 --locked

      - name: Enforce dependency licenses and sources
        run: cargo deny check licenses sources bans

      - name: Require release smoke for release-sensitive pull requests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files=$(gh api --paginate \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename')
          release_sensitive=0
          while IFS= read -r path; do
            case "$path" in
              Cargo.toml|Cargo.lock|scripts/bootstrap.sh|scripts/bootstrap.ps1|scripts/install.sh|scripts/install.ps1|scripts/prepare-mcpb.py|scripts/canonicalize-mcpb.py|scripts/generate-server-json.py|.github/workflows/mcp-registry-publish.yml|.github/workflows/release-build.yml|.github/workflows/release-draft.yml|.github/workflows/release-supply-chain-smoke.yml)
                release_sensitive=1
                ;;
            esac
          done <<<"$changed_files"
          if [ "$release_sensitive" -eq 0 ]; then
            echo "No release-sensitive paths changed."
            exit 0
          fi

          echo "Release-sensitive change detected; waiting for exact-head release supply-chain smoke."
          for attempt in $(seq 1 180); do
            runs_json=$(gh api \
              "repos/$REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")
            run=$(jq -c \
              --arg head "$HEAD_SHA" '
                [ .workflow_runs[]
                  | select(
                      .path == ".github/workflows/release-supply-chain-smoke.yml"
                      and .head_sha == $head
                      and .event == "pull_request"
                    )
                ]
                | sort_by(.created_at)
                | last // empty
              ' <<<"$runs_json")
            if [ -n "$run" ]; then
              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "Exact-head release supply-chain smoke succeeded."
                  exit 0
                fi
                echo "Release supply-chain smoke completed with conclusion=$conclusion" >&2
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Timed out waiting for release supply-chain smoke for $HEAD_SHA" >&2
          exit 1
