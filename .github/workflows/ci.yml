name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-refactor-format-fix:
    name: One-shot repository refactor formatting fix
    if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/repo-modules-13'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/repo-modules-13
          persist-credentials: true

      - name: Remove rustfmt-only leading blank line
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/repo/tests.rs')
          text = path.read_text(encoding='utf-8')
          if text.startswith('\n'):
              path.write_text(text[1:], encoding='utf-8')
          PY
          if git diff --quiet -- src/repo/tests.rs; then
            echo 'No formatting fix required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/repo/tests.rs
          git commit -m 'style: normalize extracted repository tests'
          git push origin HEAD:refactor/repo-modules-13

  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Windows x86_64 MSVC
            runner: windows-2025
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy

      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: sh
        run: |
          sh -n scripts/bootstrap.sh
          sh -n scripts/install.sh

      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @("scripts/bootstrap.ps1", "scripts/install.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  security-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Audit Cargo.lock against RustSec
        run: cargo audit --file Cargo.lock
