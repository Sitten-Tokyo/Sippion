name: Prefer definition ownership in retrieval ranking

on:
  push:
    branches:
      - feature/context-efficiency-overhaul
    paths:
      - .github/workflows/definition-ranking-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/context-efficiency-overhaul
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
        with:
          components: rustfmt
      - name: Strengthen definition ownership scoring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/hybrid.rs')
          text = path.read_text(encoding='utf-8')
          old = '''#[must_use]
pub fn structural_line_bonus(line: &str, terms: &[String]) -> f64 {
    let trimmed = line.trim_start();
    let lower = crate::core::unicode_search_fold(trimmed);
    if !terms.iter().any(|term| lower.contains(term)) {
        return 0.0;
    }
    let definition_markers = [
        "fn ",
        "pub fn ",
        "def ",
        "class ",
        "struct ",
        "enum ",
        "trait ",
        "interface ",
        "func ",
        "type ",
        "function ",
        "export function ",
        "export class ",
        "impl ",
        "mod ",
        "const ",
        "static ",
    ];
    if definition_markers
        .iter()
        .any(|marker| lower.starts_with(marker))
    {
        5.0
    } else if ["use ", "import ", "from ", "require(", "#include"]
        .iter()
        .any(|marker| lower.starts_with(marker))
    {
        2.0
    } else {
        0.0
    }
}
'''
          new = '''#[must_use]
pub fn structural_line_bonus(line: &str, terms: &[String]) -> f64 {
    let trimmed = line.trim_start();
    let lower = crate::core::unicode_search_fold(trimmed);
    if !terms.iter().any(|term| lower.contains(term)) {
        return 0.0;
    }
    let definition_markers = [
        "pub async fn ",
        "pub fn ",
        "async fn ",
        "fn ",
        "async def ",
        "def ",
        "export async function ",
        "export function ",
        "function ",
        "func ",
        "pub struct ",
        "struct ",
        "pub enum ",
        "enum ",
        "pub trait ",
        "trait ",
        "export interface ",
        "interface ",
        "pub class ",
        "export class ",
        "class ",
        "pub type ",
        "type ",
        "pub const ",
        "const ",
        "pub static ",
        "static ",
        "pub mod ",
        "mod ",
    ];
    if let Some(marker) = definition_markers
        .iter()
        .find(|marker| lower.starts_with(**marker))
    {
        let rest = lower[marker.len()..].trim_start();
        let end = rest
            .find(|ch: char| !(ch.is_alphanumeric() || ch == '_' || ch == '-' || ch == '$'))
            .unwrap_or(rest.len());
        let identifier = &rest[..end];
        let ownership_match = !identifier.is_empty()
            && terms.iter().all(|term| identifier.contains(term.as_str()));
        // Definition ownership is stronger evidence than repeated call/import references. This
        // prevents BM25 term frequency from making a caller outrank the symbol's defining file.
        return if ownership_match { 14.0 } else { 6.0 };
    }
    if ["use ", "import ", "from ", "require(", "#include"]
        .iter()
        .any(|marker| lower.starts_with(marker))
    {
        2.0
    } else {
        0.0
    }
}
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one structural_line_bonus function, found {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '''    #[test]
    fn bm25_prefers_repeated_rare_term() {'''
          test = '''    #[test]
    fn definition_ownership_outranks_import_and_call_references() {
        let symbol = vec!["validate_session_token".to_string()];
        let natural = vec![
            "session".to_string(),
            "token".to_string(),
            "validate".to_string(),
        ];
        assert!(
            structural_line_bonus("pub fn validate_session_token(token: &str) -> bool {", &symbol)
                > structural_line_bonus("use crate::auth::validate_session_token;", &symbol)
        );
        assert!(
            structural_line_bonus("pub fn validate_session_token(token: &str) -> bool {", &natural)
                > structural_line_bonus("validate_session_token(token)", &natural)
        );
    }

'''
          if text.count(marker) != 1:
              raise SystemExit('test insertion marker missing')
          path.write_text(text.replace(marker, test + marker, 1), encoding='utf-8')
          PY
          cargo fmt
          cargo test --locked hybrid::tests::definition_ownership_outranks_import_and_call_references
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/hybrid.rs
          git commit -m "Prefer symbol definitions over repeated references"
          git push origin HEAD:feature/context-efficiency-overhaul
