name: Efficiency model credential probe

on:
  pull_request:
    paths:
      - '.github/workflows/efficiency-model-probe.yml'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check benchmark credential availability
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo 'OPENAI_API_KEY=available'
          else
            echo 'OPENAI_API_KEY=missing'
          fi
