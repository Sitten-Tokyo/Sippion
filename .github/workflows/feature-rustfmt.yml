name: Feature Rustfmt

on:
  push:
    branches:
      - feature/context-efficiency-overhaul

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/context-efficiency-overhaul
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt

      - name: Apply compact schema patch and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/core.rs")
          text = path.read_text(encoding="utf-8")
          old = '"description": "Single adaptive repository-context tool. Internally combines a RAM-only incremental lexical index, BM25, path/session-agent ranking, bounded shared Tree-sitter + source-only semantic analysis, a cached weighted structural graph, cross-agent diversity, deduplication, excerpt extraction, conservative compaction, and adaptive context packing.",'
          new = '"description": "Find and pack small, relevant repository context for an AI coding task. Local, read-only, bounded, and token-aware.",'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("MCP description anchor not found")
          text = text.replace(
              '"RTK-style compression",\n                    "Repomix-style packing"',
              '"conservative source compaction",\n                    "utility-per-token context packing"',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt
          if git diff --quiet; then
            echo "Already patched and formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Compact model-visible MCP context metadata"
          git push origin HEAD:feature/context-efficiency-overhaul
