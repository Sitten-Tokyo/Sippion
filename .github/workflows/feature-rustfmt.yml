name: Feature Rustfmt

on:
  push:
    branches:
      - feature/context-efficiency-overhaul

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/context-efficiency-overhaul
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt

      - name: Align compact context diagnostics and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          context_path = Path("src/service/context.rs")
          context = context_path.read_text(encoding="utf-8")
          old_fmt = '"{DATA_PREFIX}CTX v=4 confidence={confidence:.3} incomplete={} excluded={} target_t={}\\n",'
          new_fmt = '"{DATA_PREFIX}CTX v=4 confidence={confidence:.3} incomplete={} excluded={} target_t={} hard_b={} scan_b={}\\n",'
          if old_fmt in context:
              context = context.replace(old_fmt, new_fmt, 1)
              old_arg = "        budget.target_estimated_tokens,\n"
              new_arg = (
                  "        budget.target_estimated_tokens,\n"
                  "        budget.hard_model_text_bytes,\n"
                  "        coverage.scanned_bytes,\n"
              )
              if old_arg not in context:
                  raise SystemExit("context budget argument anchor not found")
              context = context.replace(old_arg, new_arg, 1)
          elif " hard_b=" not in context:
              raise SystemExit("compact context format anchor not found")
          context_path.write_text(context, encoding="utf-8")

          main_path = Path("src/main.rs")
          main = main_path.read_text(encoding="utf-8")
          start = main.index("fn query_diagnostic(context: &str) -> QueryDiagnostic {")
          end = main.index("\nfn run_query_command", start)
          replacement = r'''fn query_diagnostic(context: &str) -> QueryDiagnostic {
              let mut ranked_files = Vec::new();
              let mut hard_budget_bytes = None;
              let mut target_estimated_tokens = None;
              let mut scanned_bytes = None;
              for line in context.lines() {
                  if line.starts_with("CTX ") {
                      hard_budget_bytes = parse_numeric_field(line, "hard_b=");
                      target_estimated_tokens = parse_numeric_field(line, "target_t=");
                      scanned_bytes = parse_numeric_field(line, "scan_b=");
                  } else if let Some(rest) = line.strip_prefix("S path=") {
                      let mut stream = serde_json::Deserializer::from_str(rest).into_iter::<String>();
                      let Some(Ok(path)) = stream.next() else {
                          continue;
                      };
                      let metadata = rest[stream.byte_offset()..].trim_start();
                      let Some(rank_text) = metadata
                          .strip_prefix("rank=")
                          .and_then(|value| value.split_whitespace().next())
                      else {
                          continue;
                      };
                      if let Ok(rank) = rank_text.parse::<f64>() {
                          ranked_files.push(RankedFileDiagnostic { path, rank });
                      }
                  }
              }
              QueryDiagnostic {
                  returned_bytes: context.len(),
                  estimated_tokens: heuristic_v3_estimated_tokens(context),
                  hard_budget_bytes,
                  target_estimated_tokens,
                  scanned_bytes,
                  ranked_files,
              }
          }
          '''
          main = main[:start] + replacement.rstrip() + main[end:]
          main_path.write_text(main, encoding="utf-8")
          PY
          cargo fmt
          if git diff --quiet; then
            echo "Already aligned and formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Align query diagnostics with compact context format"
          git push origin HEAD:feature/context-efficiency-overhaul
