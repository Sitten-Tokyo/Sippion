name: Fix ranking test module

on:
  push:
    branches:
      - feature/context-efficiency-overhaul

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/context-efficiency-overhaul
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Move test module and validate
        run: |
          set -euo pipefail
          python3 .github/scripts/move-ranking-test-module.py
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked
      - name: Commit source fix and remove temporary helpers
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/scripts/move-ranking-test-module.py .github/workflows/fix-ranking-test-module.yml
          git add src/repo/ranking.rs
          git commit -m "Fix ranking prior test placement"
          git push origin HEAD:feature/context-efficiency-overhaul
