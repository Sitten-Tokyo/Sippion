name: Release supply-chain smoke

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - scripts/bootstrap.sh
      - scripts/bootstrap.ps1
      - scripts/install.sh
      - scripts/install.ps1
      - scripts/prepare-mcpb.py
      - scripts/canonicalize-mcpb.py
      - scripts/generate-server-json.py
      - .github/workflows/mcp-registry-publish.yml
      - .github/workflows/release-build.yml
      - .github/workflows/release-draft.yml
      - .github/workflows/release-supply-chain-smoke.yml
  release:
    types:
      - published
  workflow_run:
    workflows:
      - Build draft release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Exercise reusable release build without attestations
    if: github.event_name != 'release' && github.event_name != 'workflow_run'
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      attest: false
    permissions:
      contents: read
      id-token: write
      attestations: write

  assemble:
    name: Exercise release payload assembly
    if: github.event_name != 'release' && github.event_name != 'workflow_run'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned Node.js for MCPB tooling
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'

      - name: Generate and validate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version '=0.5.9' --locked
          cargo cyclonedx --format json --spec-version 1.5 --override-filename sippion.cdx
          test -s sippion.cdx.json
          jq -e '.bomFormat == "CycloneDX" and .metadata.component.name == "sippion"' sippion.cdx.json >/dev/null

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sippion-*
          path: downloaded
          merge-multiple: false

      - name: Validate downloaded release payloads
        shell: bash
        run: |
          set -euo pipefail
          test -s sippion.cdx.json
          for artifact in \
            sippion-linux-x86_64 \
            sippion-windows-x86_64.exe \
            sippion-macos-aarch64 \
            sippion-macos-x86_64; do
            test -s "downloaded/$artifact/$artifact"
            test -s "downloaded/$artifact/$artifact.sha256"
            test -s "downloaded/$artifact/SHA256SUMS"
            (cd "downloaded/$artifact" && sha256sum -c "$artifact.sha256")
          done

      - name: Build and validate MCPB plus registry metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          tag="v$version"
          mkdir -p mcpb-work mcpb-raw registry-smoke reproducibility
          python3 scripts/prepare-mcpb.py --binary downloaded/sippion-linux-x86_64/sippion-linux-x86_64 --platform linux --version "$version" --output-dir mcpb-work/linux
          python3 scripts/prepare-mcpb.py --binary downloaded/sippion-windows-x86_64.exe/sippion-windows-x86_64.exe --platform win32 --version "$version" --output-dir mcpb-work/windows
          python3 scripts/prepare-mcpb.py --binary downloaded/sippion-macos-aarch64/sippion-macos-aarch64 --platform darwin --version "$version" --output-dir mcpb-work/macos-aarch64
          python3 scripts/prepare-mcpb.py --binary downloaded/sippion-macos-x86_64/sippion-macos-x86_64 --platform darwin --version "$version" --output-dir mcpb-work/macos-x86_64
          for spec in \
            'linux:sippion-linux-x86_64.mcpb' \
            'windows:sippion-windows-x86_64.mcpb' \
            'macos-aarch64:sippion-macos-aarch64.mcpb' \
            'macos-x86_64:sippion-macos-x86_64.mcpb'; do
            dir=${spec%%:*}
            file=${spec#*:}
            npx --yes @anthropic-ai/mcpb@2.1.2 validate "mcpb-work/$dir"
            npx --yes @anthropic-ai/mcpb@2.1.2 pack "mcpb-work/$dir" "mcpb-raw/$file"
            python3 scripts/canonicalize-mcpb.py --input "mcpb-raw/$file" --output "registry-smoke/$file"
            npx --yes @anthropic-ai/mcpb@2.1.2 info "registry-smoke/$file" >/dev/null
            test -s "registry-smoke/$file"
          done

          # Pack the same Linux input again. The official pack may stamp volatile ZIP metadata,
          # but canonical release assets must be byte-for-byte reproducible.
          npx --yes @anthropic-ai/mcpb@2.1.2 pack mcpb-work/linux reproducibility/linux.raw.mcpb
          python3 scripts/canonicalize-mcpb.py --input reproducibility/linux.raw.mcpb --output reproducibility/linux.mcpb
          cmp registry-smoke/sippion-linux-x86_64.mcpb reproducibility/linux.mcpb

          python3 scripts/generate-server-json.py --assets-dir registry-smoke --tag "$tag" --version "$version" --output registry-smoke/server.json
          curl --fail --location --silent --show-error \
            --output /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher validate registry-smoke/server.json
          for bundle in registry-smoke/*.mcpb; do
            sha256sum "$bundle" > "$bundle.sha256"
            sha256sum -c "$bundle.sha256"
          done
          sha256sum registry-smoke/server.json > registry-smoke/server.json.sha256
          sha256sum -c registry-smoke/server.json.sha256

      - name: Stage installer assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installer-smoke
          cp scripts/install.sh installer-smoke/install.sh
          cp scripts/install.ps1 installer-smoke/install.ps1
          cp sippion.cdx.json installer-smoke/sippion.cdx.json
          (
            cd installer-smoke
            sha256sum install.sh > install.sh.sha256
            sha256sum install.ps1 > install.ps1.sha256
            sha256sum sippion.cdx.json > sippion.cdx.json.sha256
            sha256sum -c install.sh.sha256
            sha256sum -c install.ps1.sha256
            sha256sum -c sippion.cdx.json.sha256
          )

  verify-published-policy:
    name: Verify all published artifacts with strict provenance policy
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'release/v')
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Resolve exact published release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            tag=$EVENT_TAG
            test -n "$tag"
            release_json=$(gh api "repos/$REPOSITORY/releases/tags/$tag")
            jq -e '.draft == false' <<<"$release_json" >/dev/null
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$RUN_EVENT" != "push" ] || [ "$RUN_CONCLUSION" != "success" ]; then
              echo "Unexpected release workflow_run state: event=$RUN_EVENT conclusion=$RUN_CONCLUSION" >&2
              exit 2
            fi
            case "$RUN_HEAD_BRANCH" in
              release/v*) tag=${RUN_HEAD_BRANCH#release/} ;;
              *) echo "Unexpected release workflow branch: $RUN_HEAD_BRANCH" >&2; exit 2 ;;
            esac
            if ! [[ "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid release workflow head SHA: $RUN_HEAD_SHA" >&2
              exit 2
            fi
            release_json=$(gh api "repos/$REPOSITORY/releases/tags/$tag")
            jq -e '.draft == false' <<<"$release_json" >/dev/null
          else
            tag=$(gh release list \
              --repo "$REPOSITORY" \
              --exclude-drafts \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName')
            test -n "$tag"
          fi
          sha=$(gh api "repos/$REPOSITORY/commits/$tag" --jq '.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$sha" != "$RUN_HEAD_SHA" ]; then
            echo "Published tag $tag resolves to $sha, expected release workflow SHA $RUN_HEAD_SHA" >&2
            exit 2
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download complete published asset set
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir published
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --dir published

          expected=(
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256
            SHA256SUMS
            sippion-linux-x86_64
            sippion-linux-x86_64.sha256
            sippion-windows-x86_64.exe
            sippion-windows-x86_64.exe.sha256
            sippion-macos-aarch64
            sippion-macos-aarch64.sha256
            sippion-macos-x86_64
            sippion-macos-x86_64.sha256
          )
          if [ "$EVENT_NAME" = "release" ] || [ "$EVENT_NAME" = "workflow_run" ]; then
            expected+=(
              sippion.cdx.json
              sippion.cdx.json.sha256
              server.json
              server.json.sha256
              sippion-linux-x86_64.mcpb
              sippion-linux-x86_64.mcpb.sha256
              sippion-windows-x86_64.mcpb
              sippion-windows-x86_64.mcpb.sha256
              sippion-macos-aarch64.mcpb
              sippion-macos-aarch64.mcpb.sha256
              sippion-macos-x86_64.mcpb
              sippion-macos-x86_64.mcpb.sha256
            )
          fi
          for asset in "${expected[@]}"; do
            test -s "published/$asset" || { echo "Missing release asset: $asset" >&2; exit 2; }
          done

      - name: Verify every published checksum
        shell: bash
        run: |
          set -euo pipefail
          cd published
          sha256sum -c SHA256SUMS
          for sidecar in \
            install.sh.sha256 \
            install.ps1.sha256 \
            sippion-linux-x86_64.sha256 \
            sippion-windows-x86_64.exe.sha256 \
            sippion-macos-aarch64.sha256 \
            sippion-macos-x86_64.sha256; do
            sha256sum -c "$sidecar"
          done
          if [ -f sippion.cdx.json.sha256 ]; then
            sha256sum -c sippion.cdx.json.sha256
          fi
          if [ -f server.json.sha256 ]; then
            sha256sum -c server.json.sha256
          fi
          for sidecar in *.mcpb.sha256; do
            [ -e "$sidecar" ] || continue
            sha256sum -c "$sidecar"
          done

      - name: Verify every published provenance attestation
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for installer in install.sh install.ps1; do
            gh attestation verify "published/$installer" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release-draft.yml" \
              --source-digest "$RELEASE_SHA" >/dev/null
          done
          if [ -f published/sippion.cdx.json ]; then
            for asset in \
              sippion.cdx.json \
              server.json \
              sippion-linux-x86_64.mcpb \
              sippion-windows-x86_64.mcpb \
              sippion-macos-aarch64.mcpb \
              sippion-macos-x86_64.mcpb; do
              gh attestation verify "published/$asset" \
                --repo "$REPOSITORY" \
                --signer-workflow "$REPOSITORY/.github/workflows/release-draft.yml" \
                --source-digest "$RELEASE_SHA" >/dev/null
            done
          fi
          for binary in \
            sippion-linux-x86_64 \
            sippion-windows-x86_64.exe \
            sippion-macos-aarch64 \
            sippion-macos-x86_64; do
            gh attestation verify "published/$binary" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release-build.yml" \
              --source-digest "$RELEASE_SHA" >/dev/null
          done
