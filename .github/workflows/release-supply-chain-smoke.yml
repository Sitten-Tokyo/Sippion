name: Release supply-chain smoke

on:
  pull_request:
    paths:
      - scripts/bootstrap.sh
      - scripts/bootstrap.ps1
      - scripts/install.sh
      - scripts/install.ps1
      - .github/workflows/release-build.yml
      - .github/workflows/release-draft.yml
      - .github/workflows/release-supply-chain-smoke.yml
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Exercise reusable release build without attestations
    if: github.event_name != 'release'
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      attest: false
    permissions:
      contents: read
      id-token: write
      attestations: write

  assemble:
    name: Exercise release payload assembly
    if: github.event_name != 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sippion-*
          path: downloaded
          merge-multiple: false

      - name: Validate downloaded release payloads
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            sippion-linux-x86_64 \
            sippion-windows-x86_64.exe \
            sippion-macos-aarch64 \
            sippion-macos-x86_64; do
            test -s "downloaded/$artifact/$artifact"
            test -s "downloaded/$artifact/$artifact.sha256"
            test -s "downloaded/$artifact/SHA256SUMS"
            (cd "downloaded/$artifact" && sha256sum -c "$artifact.sha256")
          done

      - name: Stage installer assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installer-smoke
          cp scripts/install.sh installer-smoke/install.sh
          cp scripts/install.ps1 installer-smoke/install.ps1
          (
            cd installer-smoke
            sha256sum install.sh > install.sh.sha256
            sha256sum install.ps1 > install.ps1.sha256
            sha256sum -c install.sh.sha256
            sha256sum -c install.ps1.sha256
          )

  verify-published-policy:
    name: Verify all published artifacts with strict provenance policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Resolve exact published release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            tag=$EVENT_TAG
            test -n "$tag"
            release_json=$(gh api "repos/$REPOSITORY/releases/tags/$tag")
            jq -e '.draft == false' <<<"$release_json" >/dev/null
          else
            tag=$(gh release list \
              --repo "$REPOSITORY" \
              --exclude-drafts \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName')
            test -n "$tag"
          fi
          sha=$(gh api "repos/$REPOSITORY/commits/$tag" --jq '.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download complete published asset set
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir published
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --dir published

          expected=(
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256
            SHA256SUMS
            sippion-linux-x86_64
            sippion-linux-x86_64.sha256
            sippion-windows-x86_64.exe
            sippion-windows-x86_64.exe.sha256
            sippion-macos-aarch64
            sippion-macos-aarch64.sha256
            sippion-macos-x86_64
            sippion-macos-x86_64.sha256
          )
          for asset in "${expected[@]}"; do
            test -s "published/$asset" || { echo "Missing release asset: $asset" >&2; exit 2; }
          done

      - name: Verify every published checksum
        shell: bash
        run: |
          set -euo pipefail
          cd published
          sha256sum -c SHA256SUMS
          for sidecar in \
            install.sh.sha256 \
            install.ps1.sha256 \
            sippion-linux-x86_64.sha256 \
            sippion-windows-x86_64.exe.sha256 \
            sippion-macos-aarch64.sha256 \
            sippion-macos-x86_64.sha256; do
            sha256sum -c "$sidecar"
          done

      - name: Verify every published provenance attestation
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for installer in install.sh install.ps1; do
            gh attestation verify "published/$installer" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release-draft.yml" \
              --source-digest "$RELEASE_SHA" >/dev/null
          done
          for binary in \
            sippion-linux-x86_64 \
            sippion-windows-x86_64.exe \
            sippion-macos-aarch64 \
            sippion-macos-x86_64; do
            gh attestation verify "published/$binary" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release-build.yml" \
              --source-digest "$RELEASE_SHA" >/dev/null
          done
