name: Release supply-chain smoke

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - scripts/bootstrap.sh
      - scripts/bootstrap.ps1
      - scripts/install.sh
      - scripts/install.ps1
      - .github/workflows/release-build.yml
      - .github/workflows/release-draft.yml
      - .github/workflows/release-supply-chain-smoke.yml
  release:
    types:
      - published
  workflow_run:
    workflows:
      - Build draft release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Exercise reusable release build without attestations
    if: github.event_name != 'release' && github.event_name != 'workflow_run'
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      attest: false
    permissions:
      contents: read
      id-token: write
      attestations: write

  assemble:
    name: Exercise release payload assembly
    if: github.event_name != 'release' && github.event_name != 'workflow_run'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Generate and validate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version '=0.5.9' --locked
          cargo cyclonedx --format json --spec-version 1.5 --override-filename sippion.cdx.json
          test -s sippion.cdx.json
          jq -e '.bomFormat == "CycloneDX" and .metadata.component.name == "sippion"' sippion.cdx.json >/dev/null

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sippion-*
          path: downloaded
          merge-multiple: false

      - name: Validate downloaded release payloads
        shell: bash
        run: |
          set -euo pipefail
          test -s sippion.cdx.json
          for artifact in \
            sippion-linux-x86_64 \
            sippion-windows-x86_64.exe \
            sippion-macos-aarch64 \
            sippion-macos-x86_64; do
            test -s "downloaded/$artifact/$artifact"
            test -s "downloaded/$artifact/$artifact.sha256"
            test -s "downloaded/$artifact/SHA256SUMS"
            (cd "downloaded/$artifact" && sha256sum -c "$artifact.sha256")
          done

      - name: Stage installer assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installer-smoke
          cp scripts/install.sh installer-smoke/install.sh
          cp scripts/install.ps1 installer-smoke/install.ps1
          cp sippion.cdx.json installer-smoke/sippion.cdx.json
          (
            cd installer-smoke
            sha256sum install.sh > install.sh.sha256
            sha256sum install.ps1 > install.ps1.sha256
            sha256sum sippion.cdx.json > sippion.cdx.json.sha256
            sha256sum -c install.sh.sha256
            sha256sum -c install.ps1.sha256
            sha256sum -c sippion.cdx.json.sha256
          )

  verify-published-policy:
    name: Verify all published artifacts with strict provenance policy
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'release/v')
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Resolve exact published release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            tag=$EVENT_TAG
            test -n "$tag"
            release_json=$(gh api "repos/$REPOSITORY/releases/tags/$tag")
            jq -e '.draft == false' <<<"$release_json" >/dev/null
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$RUN_EVENT" != "push" ] || [ "$RUN_CONCLUSION" != "success" ]; then
              echo "Unexpected release workflow_run state: event=$RUN_EVENT conclusion=$RUN_CONCLUSION" >&2
              exit 2
            fi
            case "$RUN_HEAD_BRANCH" in
              release/v*) tag=${RUN_HEAD_BRANCH#release/} ;;
              *) echo "Unexpected release workflow branch: $RUN_HEAD_BRANCH" >&2; exit 2 ;;
            esac
            if ! [[ "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid release workflow head SHA: $RUN_HEAD_SHA" >&2
              exit 2
            fi
            release_json=$(gh api "repos/$REPOSITORY/releases/tags/$tag")
            jq -e '.draft == false' <<<"$release_json" >/dev/null
          else
            tag=$(gh release list \
              --repo "$REPOSITORY" \
              --exclude-drafts \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName')
            test -n "$tag"
          fi
          sha=$(gh api "repos/$REPOSITORY/commits/$tag" --jq '.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$sha" != "$RUN_HEAD_SHA" ]; then
            echo "Published tag $tag resolves to $sha, expected release workflow SHA $RUN_HEAD_SHA" >&2
            exit 2
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download complete published asset set
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir published
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --dir published

          expected=(
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256
            SHA256SUMS
            sippion-linux-x86_64
            sippion-linux-x86_64.sha256
            sippion-windows-x86_64.exe
            sippion-windows-x86_64.exe.sha256
            sippion-macos-aarch64
            sippion-macos-aarch64.sha256
            sippion-macos-x86_64
            sippion-macos-x86_64.sha256
          )
          if [ "$EVENT_NAME" = "release" ] || [ "$EVENT_NAME" = "workflow_run" ]; then
            expected+=(sippion.cdx.json sippion.cdx.json.sha256)
          fi
          for asset in "${expected[@]}"; do
            test -s "published/$asset" || { echo "Missing release asset: $asset" >&2; exit 2; }
          done

      - name: Verify every published checksum
        shell: bash
        run: |
          set -euo pipefail
          cd published
          sha256sum -c SHA256SUMS
          for sidecar in \
            install.sh.sha256 \
            install.ps1.sha256 \
            sippion-linux-x86_64.sha256 \
            sippion-windows-x86_64.exe.sha256 \
            sippion-macos-aarch64.sha256 \
            sippion-macos-x86_64.sha256; do
            sha256sum -c "$sidecar"
          done
          if [ -f sippion.cdx.json.sha256 ]; then
            sha256sum -c sippion.cdx.json.sha256
          fi

      - name: Verify every published provenance attestation
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for installer in install.sh install.ps1; do
            gh attestation verify "published/$installer" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release-draft.yml" \
              --source-digest "$RELEASE_SHA" >/dev/null
          done
          if [ -f published/sippion.cdx.json ]; then
            gh attestation verify "published/sippion.cdx.json" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release-draft.yml" \
              --source-digest "$RELEASE_SHA" >/dev/null
          fi
          for binary in \
            sippion-linux-x86_64 \
            sippion-windows-x86_64.exe \
            sippion-macos-aarch64 \
            sippion-macos-x86_64; do
            gh attestation verify "published/$binary" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release-build.yml" \
              --source-digest "$RELEASE_SHA" >/dev/null
          done
