name: Natural definition holdout fix

on:
  push:
    branches:
      - feature/context-efficiency-overhaul

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/context-efficiency-overhaul
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
        with:
          components: rustfmt, clippy
      - name: Apply definition ownership and packing fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return text.replace(old, new, 1)

          def rewrite_test(source, fn_name, replacements):
              marker = f'    fn {fn_name}() {{'
              start = source.index(marker)
              next_test = source.find('    #[test]', start + len(marker))
              end = len(source) if next_test < 0 else next_test
              segment = source[start:end]
              for old, new in replacements:
                  if old not in segment:
                      raise SystemExit(f'{fn_name}: missing {old!r}')
                  segment = segment.replace(old, new)
              return source[:start] + segment + source[end:]

          hybrid = Path('src/hybrid.rs')
          text = hybrid.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '        let coverage_bonus = 6.0 + identifier_matches as f64 * 4.0;',
              '''        // Keep the established single-symbol ownership score, but make a compound definition
          // that owns two or more natural-language query concepts stronger than surrounding prose.
          // This is definition-only; ordinary compound references retain the weaker bonus below.
          let coverage_bonus = if identifier_matches >= 2 {
              18.0 + identifier_matches as f64 * 6.0
          } else {
              10.0
          };''',
              'definition bonus',
          )
          text = replace_once(text, '.min(22.0);', '.min(36.0);', 'definition cap')
          text = rewrite_test(text, 'natural_query_rewards_partial_identifier_ownership_and_references', [
              ('"source".to_string()', '"orchid".to_string()'),
              ('"fingerprint".to_string()', '"ledger".to_string()'),
              ('"evidence".to_string()', '"record".to_string()'),
              ('source_content_fingerprint', 'orchid_ledger_checkpoint'),
              ('text: &str', 'value: &str'),
              ('(&text)', '(&value)'),
              ('source fingerprint stale evidence', 'orchid ledger stale record'),
          ])
          text = rewrite_test(text, 'restricted_rust_visibility_is_treated_as_definition_ownership', [
              ('"project".to_string()', '"quasar".to_string()'),
              ('"markers".to_string()', '"table".to_string()'),
              ('PROJECT_MARKERS', 'QUASAR_TABLE'),
          ])
          hybrid.write_text(text, encoding='utf-8')

          context = Path('src/service/context.rs')
          text = context.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''struct ContextAtom {
              kind: ContextAtomKind,
              path: String,
              text: String,
              utility: f64,
              token_cost: usize,
          }'''.replace('              ', ''),
              '''struct ContextAtom {
              kind: ContextAtomKind,
              path: String,
              text: String,
              utility: f64,
              token_cost: usize,
              query_symbol_matches: usize,
          }'''.replace('              ', ''),
              'context atom field',
          )
          text = replace_once(
              text,
              'fn structure_atom(entry: &RepoMapEntry, weights: ContextPackerWeights) -> ContextAtom {',
              'fn structure_atom(\n    query: &NormalizedQuery,\n    entry: &RepoMapEntry,\n    weights: ContextPackerWeights,\n) -> ContextAtom {',
              'structure atom signature',
          )

          structure_start = text.index('fn structure_atom(')
          structure_end = text.index('\nfn framed_evidence_body', structure_start)
          structure = text[structure_start:structure_end]
          structure = replace_once(
              structure,
              '    for symbol in entry.symbols.iter().take(3) {\n',
              '    let mut visible_symbol_text = String::new();\n    for symbol in entry.symbols.iter().take(3) {\n',
              'visible symbol buffer',
          )
          structure = replace_once(
              structure,
              '''            escaped(symbol.signature.trim())
                  ));
              }
              let semantic_bonus ='''.replace('              ', ''),
              '''            escaped(symbol.signature.trim())
                  ));
                  visible_symbol_text.push_str(&symbol.name);
                  visible_symbol_text.push(' ');
                  visible_symbol_text.push_str(&symbol.signature);
                  visible_symbol_text.push(' ');
              }
              let folded_symbols = crate::core::unicode_search_fold(&visible_symbol_text);
              let query_symbol_matches = query
                  .terms
                  .iter()
                  .filter(|term| folded_symbols.contains(term.as_str()))
                  .count();
              let semantic_bonus ='''.replace('              ', ''),
              'visible symbol relevance',
          )
          structure = replace_once(
              structure,
              '        utility,\n    }\n}',
              '        utility,\n        query_symbol_matches,\n    }\n}',
              'structure atom relevance field',
          )
          text = text[:structure_start] + structure + text[structure_end:]

          evidence_start = text.index('fn evidence_atom(')
          evidence_end = text.index('\nfn best_fitting_atom', evidence_start)
          evidence = text[evidence_start:evidence_end]
          evidence = replace_once(
              evidence,
              '        utility,\n    }\n}',
              '        utility,\n        query_symbol_matches: 0,\n    }\n}',
              'evidence atom relevance field',
          )
          text = text[:evidence_start] + evidence + text[evidence_end:]

          text = replace_once(
              text,
              '    atoms.extend(entries.iter().map(|entry| structure_atom(entry, weights)));',
              '''    atoms.extend(
                  entries
                      .iter()
                      .map(|entry| structure_atom(query, entry, weights)),
              );'''.replace('              ', ''),
              'structure atom construction',
          )

          pack_start = text.index('fn pack_context_with_weights(')
          greedy_at = text.index('    while order.len() < MAX_PACKED_ATOMS {', pack_start)
          reservation = '''    // Preserve one query-relevant definition/signature structure when it fits. This keeps a
          // compact symbol-level ownership signal model-visible instead of letting prose-heavy atoms
          // crowd it out, while retaining the same soft token and hard atom budgets.
          if order.len() < MAX_PACKED_ATOMS {
              if let Some((index, atom)) = atoms
                  .iter()
                  .enumerate()
                  .filter(|(index, atom)| {
                      !selected.contains(index)
                          && atom.kind == ContextAtomKind::Structure
                          && atom.query_symbol_matches > 0
                  })
                  .filter(|(_, atom)| {
                      atom.token_cost <= remaining_tokens && atom.text.len() <= remaining_bytes
                  })
                  .max_by(|(left_index, left), (right_index, right)| {
                      left.query_symbol_matches
                          .cmp(&right.query_symbol_matches)
                          .then_with(|| {
                              left.utility
                                  .partial_cmp(&right.utility)
                                  .unwrap_or(Ordering::Equal)
                          })
                          .then_with(|| right_index.cmp(left_index))
                  })
              {
                  selected.insert(index);
                  selected_paths.insert(atom.path.clone());
                  remaining_tokens = remaining_tokens.saturating_sub(atom.token_cost);
                  remaining_bytes = remaining_bytes.saturating_sub(atom.text.len());
                  order.push(index);
              }
          }

          '''
          text = text[:greedy_at] + reservation + text[greedy_at:]

          novelty_start = text.index('    fn novelty_discount_ablation_prefers_new_path_over_redundant_same_path() {')
          novelty_end = text.index('\n    }', novelty_start) + len('\n    }')
          novelty = text[novelty_start:novelty_end]
          needle = '                token_cost: 10,\n            },'
          if novelty.count(needle) != 2:
              raise SystemExit(f'novelty atom initializers: expected 2, got {novelty.count(needle)}')
          novelty = novelty.replace(
              needle,
              '                token_cost: 10,\n                query_symbol_matches: 0,\n            },',
          )
          text = text[:novelty_start] + novelty + text[novelty_end:]

          test_marker = '    #[test]\n    fn novelty_discount_ablation_prefers_new_path_over_redundant_same_path() {'
          test = '''    #[test]
          fn packer_reserves_query_relevant_structure_symbol() {
              let mut entries = (0..12)
                  .map(|index| RepoMapEntry {
                      relative_path: format!("src/noise_{index}.rs"),
                      score: 1_000.0 - index as f64,
                      symbols: vec![RepoMapSymbol {
                          name: format!("unrelated_{index}"),
                          kind: "function".into(),
                          line: 1,
                          signature: format!("fn unrelated_{index}()"),
                      }],
                      links_to: Vec::new(),
                      semantic_links: Vec::new(),
                  })
                  .collect::<Vec<_>>();
              entries.push(RepoMapEntry {
                  relative_path: "src/auth_definition.rs".into(),
                  score: 0.1,
                  symbols: vec![RepoMapSymbol {
                      name: "authentication_token".into(),
                      kind: "function".into(),
                      line: 7,
                      signature: "fn authentication_token()".into(),
                  }],
                  links_to: Vec::new(),
                  semantic_links: Vec::new(),
              });
              let coverage = SearchCoverage {
                  discovery_complete: true,
                  eligible_files: entries.len(),
                  indexed_files: entries.len(),
                  confidence_milli: 900,
                  ..SearchCoverage::default()
              };
              let packed = pack_context(&query(), &entries, &[], "", &coverage);
              assert!(packed.text.contains("authentication_token"));
              assert!(packed.packed_paths.contains(&"src/auth_definition.rs".to_string()));
          }

          #[test]
          fn novelty_discount_ablation_prefers_new_path_over_redundant_same_path() {'''.replace('          ', '')
          text = replace_once(text, test_marker, test, 'packer reservation test')
          context.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
      - name: Validate whole repository holdout
        run: |
          set -euo pipefail
          holdout_root="$RUNNER_TEMP/sippion-self-holdout"
          rm -rf "$holdout_root"
          mkdir -p "$holdout_root"
          tar --exclude='./.git' --exclude='./target' --exclude='./eval' --exclude='./node_modules' --exclude='./.github/workflows/natural-definition-holdout-fix.yml' -cf - . | tar -xf - -C "$holdout_root"
          python3 scripts/retrieval-eval.py \
            --binary target/release/sippion \
            --cases eval/self_holdout_cases.json \
            --fixture "$holdout_root" \
            --baseline-root "$holdout_root"
      - name: Commit validated fixes and remove helper
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/hybrid.rs src/service/context.rs
          git rm -f .github/workflows/natural-definition-holdout-fix.yml
          git commit -m "Preserve query-relevant definitions in packed context"
          git push origin HEAD:feature/context-efficiency-overhaul
