name: Natural definition holdout fix

on:
  push:
    branches:
      - feature/context-efficiency-overhaul

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/context-efficiency-overhaul
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
        with:
          components: rustfmt, clippy
      - name: Apply natural definition ownership fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/hybrid.rs')
          text = path.read_text(encoding='utf-8')

          old_line = '        let coverage_bonus = 6.0 + identifier_matches as f64 * 4.0;'
          new_lines = '''        // Keep the established single-symbol ownership score, but make a compound definition
          // that owns two or more natural-language query concepts stronger than surrounding prose.
          // This is definition-only; ordinary compound references retain the weaker bonus below.
          let coverage_bonus = if identifier_matches >= 2 {
              18.0 + identifier_matches as f64 * 6.0
          } else {
              10.0
          };'''
          if text.count(old_line) != 1:
              raise SystemExit('definition bonus line mismatch')
          text = text.replace(old_line, new_lines, 1)
          if text.count('.min(22.0);') != 1:
              raise SystemExit('definition bonus cap mismatch')
          text = text.replace('.min(22.0);', '.min(36.0);', 1)

          def rewrite_test(source, fn_name, replacements):
              marker = f'    fn {fn_name}() {{'
              start = source.index(marker)
              next_test = source.find('    #[test]', start + len(marker))
              end = len(source) if next_test < 0 else next_test
              segment = source[start:end]
              for old, new in replacements:
                  if old not in segment:
                      raise SystemExit(f'{fn_name}: missing {old!r}')
                  segment = segment.replace(old, new)
              return source[:start] + segment + source[end:]

          text = rewrite_test(text, 'natural_query_rewards_partial_identifier_ownership_and_references', [
              ('"source".to_string()', '"orchid".to_string()'),
              ('"fingerprint".to_string()', '"ledger".to_string()'),
              ('"evidence".to_string()', '"record".to_string()'),
              ('source_content_fingerprint', 'orchid_ledger_checkpoint'),
              ('text: &str', 'value: &str'),
              ('(&text)', '(&value)'),
              ('source fingerprint stale evidence', 'orchid ledger stale record'),
          ])
          text = rewrite_test(text, 'restricted_rust_visibility_is_treated_as_definition_ownership', [
              ('"project".to_string()', '"quasar".to_string()'),
              ('"markers".to_string()', '"table".to_string()'),
              ('PROJECT_MARKERS', 'QUASAR_TABLE'),
          ])
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
      - name: Validate whole repository holdout
        run: |
          set -euo pipefail
          holdout_root="$RUNNER_TEMP/sippion-self-holdout"
          rm -rf "$holdout_root"
          mkdir -p "$holdout_root"
          tar --exclude='./.git' --exclude='./target' --exclude='./eval' --exclude='./node_modules' --exclude='./.github/workflows/natural-definition-holdout-fix.yml' -cf - . | tar -xf - -C "$holdout_root"
          python3 scripts/retrieval-eval.py \
            --binary target/release/sippion \
            --cases eval/self_holdout_cases.json \
            --fixture "$holdout_root" \
            --baseline-root "$holdout_root"
      - name: Commit validated fix and remove helper
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/hybrid.rs
          git rm -f .github/workflows/natural-definition-holdout-fix.yml
          git commit -m "Strengthen natural-query definition ownership"
          git push origin HEAD:feature/context-efficiency-overhaul
