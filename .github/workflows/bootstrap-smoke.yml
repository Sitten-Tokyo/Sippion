name: Bootstrap smoke test

on:
  pull_request:
    paths:
      - scripts/bootstrap.sh
      - scripts/bootstrap.ps1
      - scripts/install.sh
      - scripts/install.ps1
      - .github/workflows/bootstrap-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 bootstrap
            runner: ubuntu-24.04
          - name: Windows x86_64 bootstrap
            runner: windows-2025
          - name: macOS Apple Silicon bootstrap
            runner: macos-15
          - name: macOS Intel bootstrap
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Unix bootstrap chain
        if: runner.os != 'Windows'
        shell: sh
        env:
          SIPPION_BOOTSTRAP_VERIFY_ONLY: '1'
        run: sh scripts/bootstrap.sh

      - name: Verify Windows bootstrap chain
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIPPION_BOOTSTRAP_VERIFY_ONLY: '1'
        run: '& scripts/bootstrap.ps1'
