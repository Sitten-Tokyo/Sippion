name: Workflow lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-pinned actionlint 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Validate workflow syntax and expressions
        # Installer shell code has its own dedicated ShellCheck/PSScriptAnalyzer gate. Disable
        # actionlint's optional embedded-shell pass here so this job owns workflow syntax only.
        run: actionlint -shellcheck=

      - name: Install checksum-pinned zizmor 1.29.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo 'dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839  '"$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/zizmor"
          tar -xzf "$archive" -C "$RUNNER_TEMP/zizmor"
          echo "$RUNNER_TEMP/zizmor" >> "$GITHUB_PATH"

      - name: Audit workflow security posture
        run: zizmor .github/workflows
