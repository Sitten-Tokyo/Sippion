name: Temporary quality feature builder

on:
  push:
    branches:
      - feature/eval-conformance-cli-registry

permissions:
  contents: write

concurrency:
  group: temporary-quality-feature-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/eval-conformance-cli-registry
          fetch-depth: 0

      - name: Apply feature implementation
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Sippion exposes one tool/It exposes one tool/' scripts/apply_quality_features.py
          python3 scripts/apply_quality_features.py
          python3 -c 'from pathlib import Path; import textwrap; files=["src/main.rs","scripts/retrieval-eval.py","scripts/mcp-conformance.mjs","scripts/prepare-mcpb.py","scripts/generate-server-json.py",".github/workflows/mcp-registry-publish.yml"]; [(p:=Path(f)).write_text(textwrap.dedent(p.read_text(encoding="utf-8").removeprefix("\\\n")), encoding="utf-8") for f in files]'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy

      - name: Format and validate Rust
        run: |
          cargo fmt
          cargo check --locked
          cargo test --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build release binary and run retrieval eval
        run: |
          cargo build --release --locked
          python3 scripts/retrieval-eval.py --binary target/release/sippion

      - name: Commit validated non-workflow changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git restore -- .github/workflows/author-auto-merge.yml .github/workflows/ci.yml .github/workflows/release-draft.yml .github/workflows/release-supply-chain-smoke.yml scripts/apply_quality_features.py
          rm -f .github/workflows/mcp-registry-publish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add retrieval eval, diagnostics, conformance, and registry packaging'
          git push origin HEAD:feature/eval-conformance-cli-registry
