name: Apply efficiency finalization

on:
  push:
    branches:
      - feat/finish-efficiency-integration
    paths:
      - 'scripts/apply-efficiency-finalization.py'
      - '.github/workflows/efficiency-finalize-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/finish-efficiency-integration
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy

      - name: Apply source patch
        run: python3 scripts/apply-efficiency-finalization.py

      - name: Verify source patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo build --release --locked
          cargo test --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
          python3 scripts/retrieval-eval.py --binary target/release/sippion

      - name: Commit verified source and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-efficiency-finalization.py .github/workflows/efficiency-finalize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: finalize efficiency rule and atom cap'
          git push origin HEAD:feat/finish-efficiency-integration
