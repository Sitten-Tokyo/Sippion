name: Final quality patch

on:
  push:
    branches:
      - feature/context-efficiency-overhaul

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/context-efficiency-overhaul
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Apply patch
        run: python3 .github/scripts/final-quality-patch.py
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --locked
      - name: Commit implementation and remove temporary helpers
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/scripts/final-quality-patch.py .github/workflows/final-quality-patch.yml
          git add src
          git commit -m "Tighten broad-query context quality"
          git push origin HEAD:feature/context-efficiency-overhaul
