name: Refresh rc32 lockfile once

on:
  push:
    branches:
      - 'fix/prerelease-install-resolution'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/prerelease-install-resolution
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0

      - name: Refresh Cargo.lock and validate the exact diff
        shell: bash
        run: |
          set -euo pipefail
          cargo check
          python3 - <<'PY'
          import subprocess
          import sys

          diff = subprocess.check_output(["git", "diff", "--", "Cargo.lock"], text=True)
          changed = [
              line
              for line in diff.splitlines()
              if line.startswith(("+", "-")) and not line.startswith(("+++", "---"))
          ]
          expected = [
              '-version = "0.1.0-rc.31"',
              '+version = "0.1.0-rc.32"',
          ]
          if changed != expected:
              print("Unexpected Cargo.lock change:", file=sys.stderr)
              print(diff, file=sys.stderr)
              raise SystemExit(2)
          PY

      - name: Commit refreshed lockfile and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-rc32-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/refresh-rc32-lock.yml
          git commit -m "Refresh Cargo.lock for v0.1.0-rc.32"
          git push origin HEAD:fix/prerelease-install-resolution
