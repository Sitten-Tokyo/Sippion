name: Format context efficiency follow-up code

on:
  push:
    branches:
      - feature/context-efficiency-overhaul
    paths:
      - .github/workflows/context-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/context-efficiency-overhaul
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
        with:
          components: rustfmt
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "Format context efficiency follow-up code"
          git push origin HEAD:feature/context-efficiency-overhaul
