name: Fix Windows map cleanup

on:
  push:
    branches:
      - feature/context-efficiency-overhaul
    paths:
      - .github/workflows/windows-map-cleanup-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/context-efficiency-overhaul
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
        with:
          components: rustfmt
      - name: Patch Windows-specific cleanup and warning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/repo/map.rs')
          text = path.read_text(encoding='utf-8')

          old = '''    fn verified_source_for_map_hit(
        &self,
        hit: &SearchHit,
        snapshots: &HashMap<String, Arc<str>>,
    ) -> Result<Option<VerifiedSource>, RepositoryAccessError> {
        #[cfg(not(windows))]
'''
          new = '''    fn verified_source_for_map_hit(
        &self,
        hit: &SearchHit,
        snapshots: &HashMap<String, Arc<str>>,
    ) -> Result<Option<VerifiedSource>, RepositoryAccessError> {
        #[cfg(windows)]
        let _ = snapshots;

        #[cfg(not(windows))]
'''
          if text.count(old) != 1:
              raise SystemExit(f'verified_source_for_map_hit marker count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        assert!(
            mapped
                .entries
                .iter()
                .any(|entry| entry.relative_path == "dependency.rs")
        );
        std::fs::remove_dir_all(root).expect("cleanup");
'''
          new = '''        assert!(
            mapped
                .entries
                .iter()
                .any(|entry| entry.relative_path == "dependency.rs")
        );
        // RepositoryAccess owns a capability directory handle. Windows refuses to delete the
        // temporary root while that handle is open, so release it before cleanup.
        drop(repository);
        std::fs::remove_dir_all(root).expect("cleanup");
'''
          if text.count(old) != 1:
              raise SystemExit(f'cleanup marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt
          cargo test --locked repo::map::optimized_tests::import_neighbor_can_enter_structure_without_lexical_query_match
          git diff --check
      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/windows-map-cleanup-fix.yml
          git add src/repo/map.rs
          git commit -m "Fix Windows semantic expansion test cleanup"
          git push origin HEAD:feature/context-efficiency-overhaul
