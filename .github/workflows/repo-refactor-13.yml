name: One-shot repo module splitter

on:
  push:
    branches:
      - refactor/repo-modules-13
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/repo-modules-13

      - name: Split repo.rs without changing behavior
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^mod access;$' src/repo.rs && test -f src/repo/access.rs; then
            echo 'repo.rs is already split; nothing to do.'
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/repo.rs')
          text = source_path.read_text(encoding='utf-8')
          test_marker = '#[cfg(test)]\nmod tests {'
          if test_marker not in text:
              raise SystemExit('test module marker not found')

          test_start = text.index(test_marker)
          tests_full = text[test_start:]
          open_brace = tests_full.index('{')
          close_brace = tests_full.rfind('}')
          if close_brace < open_brace or tests_full[close_brace + 1:].strip():
              raise SystemExit('test module is not the final top-level item')
          tests_inner = tests_full[open_brace + 1:close_brace]
          if tests_inner.startswith('\n'):
              tests_inner = tests_inner[1:]
          core = text[:test_start].rstrip() + '\n'

          impl_marker = 'impl RepositoryAccess {'
          impl_start = core.index(impl_marker)
          impl_body_start = impl_start + len(impl_marker)
          rest = core[impl_body_start:]
          closing = re.search(r'(?m)^}\s*$', rest)
          if not closing:
              raise SystemExit('RepositoryAccess impl closing brace not found')
          impl_body = rest[:closing.start()]
          after_impl = rest[closing.end():]
          before_impl = core[:impl_start]

          def attached_start(lines, declaration_index, indent):
              cursor = declaration_index
              while cursor > 0:
                  previous = lines[cursor - 1]
                  stripped = previous.strip()
                  leading = len(previous) - len(previous.lstrip(' '))
                  if stripped == '':
                      cursor -= 1
                      continue
                  if leading == indent and (
                      stripped.startswith('///')
                      or stripped.startswith('//')
                      or stripped.startswith('#[')
                  ):
                      cursor -= 1
                      continue
                  break
              return cursor

          method_lines = impl_body.splitlines(keepends=True)
          method_decl = re.compile(
              r'^    (?:(?:pub(?:\([^)]*\))?)\s+)?(?:(?:async|unsafe)\s+)?fn\s+([A-Za-z_][A-Za-z0-9_]*)'
          )
          method_decls = []
          for index, line in enumerate(method_lines):
              match = method_decl.match(line)
              if match:
                  method_decls.append((index, match.group(1)))
          if not method_decls:
              raise SystemExit('no RepositoryAccess methods found')

          method_starts = [attached_start(method_lines, index, 4) for index, _ in method_decls]
          if len(set(method_starts)) != len(method_starts):
              raise SystemExit('overlapping RepositoryAccess method prefixes')

          access_names = {
              'open', 'open_with_scan_budget', 'ensure_root_path_identity',
              'verified_metadata_stamp', 'open_file_nofollow', 'discover_files',
              'read_source', 'reset_ram_index', 'reset_structural_caches',
          }

          def method_group(name):
              lowered = name.lower()
              if name in access_names:
                  return 'access'
              if any(token in lowered for token in (
                  'analysis', 'graph', 'repository_map', 'repo_map', 'semantic', 'map_'
              )):
                  return 'map'
              if any(token in lowered for token in (
                  'remember', 'memory', 'coordination', 'prior_', 'agent_'
              )):
                  return 'coordination'
              return 'search'

          method_groups = {name: [] for name in ('access', 'search', 'map', 'coordination')}
          prefix = ''.join(method_lines[:method_starts[0]])
          for position, ((decl_index, name), start) in enumerate(zip(method_decls, method_starts)):
              end = method_starts[position + 1] if position + 1 < len(method_starts) else len(method_lines)
              segment = ''.join(method_lines[start:end])
              if position == 0 and prefix:
                  segment = prefix + segment
              segment = re.sub(
                  r'(?m)^    (?P<qual>(?:(?:async|unsafe)\s+)?)fn\s+',
                  lambda match: '    pub(super) ' + match.group('qual') + 'fn ',
                  segment,
                  count=1,
              )
              method_groups[method_group(name)].append(segment.rstrip() + '\n')

          tail_lines = after_impl.splitlines(keepends=True)
          item_decl = re.compile(
              r'^(?:(?:pub(?:\([^)]*\))?)\s+)?(?:(?:async|unsafe)\s+)?'
              r'(fn|struct|enum|impl|type|const|static|trait)\b(?:\s+([A-Za-z_][A-Za-z0-9_]*))?'
          )
          items = []
          for index, line in enumerate(tail_lines):
              match = item_decl.match(line)
              if match:
                  items.append((index, match.group(1), match.group(2)))

          helper_groups = {name: [] for name in ('policy', 'ranking', 'redaction', 'map_helpers')}
          retained_tail = []
          if items:
              item_starts = [attached_start(tail_lines, index, 0) for index, _, _ in items]
              retained_tail.append(''.join(tail_lines[:item_starts[0]]))

              def helper_group(name):
                  lowered = name.lower()
                  if any(token in lowered for token in ('redact', 'secret', 'credential', 'sensitive')):
                      return 'redaction'
                  if lowered == 'map_io' or any(token in lowered for token in (
                      'normalize_relative', 'denied', 'pruned', 'obvious_binary',
                      'source_stamp', 'root_identity', 'hard_link', 'cap_source',
                      'policy_excluded', 'multiple_hard_links'
                  )):
                      return 'policy'
                  if any(token in lowered for token in (
                      'repository_map', 'repo_map', 'semantic', 'symbol', 'signature',
                      'link_', '_link', 'analysis'
                  )):
                      return 'map_helpers'
                  return 'ranking'

              for position, ((decl_index, kind, name), start) in enumerate(zip(items, item_starts)):
                  end = item_starts[position + 1] if position + 1 < len(item_starts) else len(tail_lines)
                  segment = ''.join(tail_lines[start:end])
                  if kind == 'fn' and name:
                      segment = re.sub(
                          r'(?m)^(?P<qual>(?:(?:async|unsafe)\s+)?)fn\s+',
                          lambda match: 'pub(super) ' + match.group('qual') + 'fn ',
                          segment,
                          count=1,
                      )
                      helper_groups[helper_group(name)].append(segment.rstrip() + '\n')
                  else:
                      retained_tail.append(segment)
          else:
              retained_tail.append(after_impl)

          module_dir = Path('src/repo')
          module_dir.mkdir(parents=True, exist_ok=True)

          for name, blocks in method_groups.items():
              if not blocks:
                  raise SystemExit(f'no methods classified for {name}')
              content = 'use super::*;\n\nimpl RepositoryAccess {\n' + '\n'.join(blocks) + '}\n'
              (module_dir / f'{name}.rs').write_text(content, encoding='utf-8')

          for name, blocks in helper_groups.items():
              if not blocks:
                  raise SystemExit(f'no helper functions classified for {name}')
              content = 'use super::*;\n\n' + '\n'.join(blocks)
              (module_dir / f'{name}.rs').write_text(content, encoding='utf-8')

          (module_dir / 'tests.rs').write_text(tests_inner.rstrip() + '\n', encoding='utf-8')

          module_prelude = '''\
mod access;
mod coordination;
mod map;
mod map_helpers;
mod policy;
mod ranking;
mod redaction;
mod search;

use map_helpers::*;
use policy::*;
use ranking::*;
use redaction::*;

'''
          retained = ''.join(retained_tail).strip('\n')
          rebuilt = before_impl.rstrip() + '\n\n' + module_prelude
          if retained:
              rebuilt += retained + '\n\n'
          rebuilt += '#[cfg(test)]\nmod tests;\n'
          source_path.write_text(rebuilt, encoding='utf-8')

          print('split sizes:')
          for path in [source_path, *sorted(module_dir.glob('*.rs'))]:
              print(f'  {path}: {len(path.read_text(encoding="utf-8").splitlines())} lines')
          PY

          cargo fmt || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/repo.rs src/repo
          git commit -m 'refactor: split repository engine into focused modules'
          git push
