name: Merge trusted author after CI

# This workflow is evaluated from the default branch and never checks out pull-request contents.
# A trusted-author PR can merge only after CI and every path-applicable smoke workflow have
# succeeded for the exact head. The CI artifact records the exact base/head pair that was tested.
on:
  workflow_run:
    workflows:
      - CI
      - Bootstrap smoke test
      - Release supply-chain smoke
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

# Serialize all trusted-author merges. This prevents two successful workflow_run events from
# independently validating the same main tip and then racing each other into main.
concurrency:
  group: trusted-author-main-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'Sitten-Tokyo/Sippion' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Resolve exact tested head and validation set
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid workflow-run head SHA" >&2
            exit 1
          fi

          prs_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/${RUN_HEAD_SHA}/pulls")"
          matching="$(jq -c \
            --arg repository "$REPOSITORY" \
            --arg expected_head_sha "$RUN_HEAD_SHA" '
              [ .[]
                | select(
                    .state == "open"
                    and .draft == false
                    and .base.ref == "main"
                    and .user.login == "Sitten-Tokyo"
                    and .user.type == "User"
                    and .head.repo.full_name == $repository
                    and .head.repo.fork == false
                    and .head.sha == $expected_head_sha
                  )
              ]
            ' <<<"$prs_json")"

          if [[ "$(jq 'length' <<<"$matching")" -ne 1 ]]; then
            echo "Expected exactly one eligible trusted-author PR for $RUN_HEAD_SHA" >&2
            exit 1
          fi
          pr_number="$(jq -r '.[0].number' <<<"$matching")"
          [[ "$pr_number" =~ ^[0-9]+$ ]] || { echo "Invalid PR number" >&2; exit 1; }

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          jq -e \
            --arg repository "$REPOSITORY" \
            --arg expected_head_sha "$RUN_HEAD_SHA" '
              .state == "open"
              and .draft == false
              and .base.ref == "main"
              and .user.login == "Sitten-Tokyo"
              and .user.type == "User"
              and .head.repo.full_name == $repository
              and .head.repo.fork == false
              and .head.sha == $expected_head_sha
            ' <<<"$pr_json" >/dev/null

          changed_files="$(gh api --paginate \
            "repos/${REPOSITORY}/pulls/${pr_number}/files?per_page=100" \
            --jq '.[].filename')"
          require_bootstrap=0
          require_release=0
          while IFS= read -r path; do
            case "$path" in
              scripts/bootstrap.sh|scripts/bootstrap.ps1|scripts/install.sh|scripts/install.ps1|.github/workflows/bootstrap-smoke.yml)
                require_bootstrap=1
                ;;
            esac
            case "$path" in
              Cargo.toml|Cargo.lock|scripts/bootstrap.sh|scripts/bootstrap.ps1|scripts/install.sh|scripts/install.ps1|.github/workflows/release-build.yml|.github/workflows/release-draft.yml|.github/workflows/release-supply-chain-smoke.yml)
                require_release=1
                ;;
            esac
          done <<<"$changed_files"

          runs_json="$(gh api \
            "repos/${REPOSITORY}/actions/runs?head_sha=${RUN_HEAD_SHA}&event=pull_request&per_page=100")"

          has_successful_workflow() {
            local workflow_path=$1
            jq -e \
              --arg path "$workflow_path" \
              --arg head "$RUN_HEAD_SHA" '
                [ .workflow_runs[]
                  | select(
                      .path == $path
                      and .head_sha == $head
                      and .event == "pull_request"
                      and .status == "completed"
                      and .conclusion == "success"
                    )
                ] | length > 0
              ' <<<"$runs_json" >/dev/null
          }

          if [[ "$require_bootstrap" -eq 1 ]] && ! has_successful_workflow '.github/workflows/bootstrap-smoke.yml'; then
            echo "Bootstrap smoke has not succeeded for $RUN_HEAD_SHA yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$require_release" -eq 1 ]] && ! has_successful_workflow '.github/workflows/release-supply-chain-smoke.yml'; then
            echo "Release supply-chain smoke has not succeeded for $RUN_HEAD_SHA yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tested_base_sha=''
          mapfile -t ci_run_ids < <(jq -r \
            --arg head "$RUN_HEAD_SHA" '
              [ .workflow_runs[]
                | select(
                    .path == ".github/workflows/ci.yml"
                    and .head_sha == $head
                    and .event == "pull_request"
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ]
              | sort_by(.created_at) | reverse | .[].id
            ' <<<"$runs_json")

          for ci_run_id in "${ci_run_ids[@]}"; do
            for retry in 1 2 3; do
              artifacts_json="$(gh api \
                "repos/${REPOSITORY}/actions/runs/${ci_run_id}/artifacts?per_page=100")"
              mapfile -t bindings < <(jq -r \
                --arg head "$RUN_HEAD_SHA" '
                  .artifacts[]
                  | select(
                      .expired == false
                      and (.name | test("^ci-binding-[0-9a-f]{40}-" + $head + "$"))
                    )
                  | .name
                ' <<<"$artifacts_json")
              if [[ "${#bindings[@]}" -eq 1 ]]; then
                binding_name="${bindings[0]}"
                tested_base_sha="${binding_name#ci-binding-}"
                tested_base_sha="${tested_base_sha%-${RUN_HEAD_SHA}}"
                break 2
              fi
              sleep 2
            done
          done

          if [[ ! "$tested_base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No successful CI run carries one exact base/head binding for $RUN_HEAD_SHA yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "tested_base_sha=$tested_base_sha" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Rebase validation onto current main or merge exact head
        if: steps.pr.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTED_BASE_SHA: ${{ steps.pr.outputs.tested_base_sha }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg repository "$REPOSITORY" \
            --arg head "$RUN_HEAD_SHA" '
              .state == "open"
              and .draft == false
              and .base.ref == "main"
              and .user.login == "Sitten-Tokyo"
              and .user.type == "User"
              and .head.repo.full_name == $repository
              and .head.repo.fork == false
              and .head.sha == $head
            ' <<<"$pr_json" >/dev/null

          main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid main SHA" >&2; exit 1; }

          if [[ "$main_sha" != "$TESTED_BASE_SHA" ]]; then
            echo "main advanced from tested base $TESTED_BASE_SHA to $main_sha; updating PR branch and requiring fresh CI."
            gh api --method PUT \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
              -f expected_head_sha="$RUN_HEAD_SHA" >/dev/null
            exit 0
          fi

          # One final base read immediately before the exact-head merge. Repository-wide workflow
          # concurrency serializes automated main merges; branch protection remains an independent
          # second line of defense against direct pushes.
          final_main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$final_main_sha" != "$TESTED_BASE_SHA" ]]; then
            echo "main changed during merge validation; updating PR branch instead of merging."
            gh api --method PUT \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
              -f expected_head_sha="$RUN_HEAD_SHA" >/dev/null
            exit 0
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --squash \
            --match-head-commit "$RUN_HEAD_SHA"
