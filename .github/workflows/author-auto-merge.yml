name: Merge trusted author after CI

# workflow_run evaluates this workflow from the default branch and never checks out or executes
# pull-request contents. A trusted-author PR is considered for merge only after the complete CI
# workflow for its exact head SHA has succeeded, so correctness does not depend on repository
# branch-protection settings being configured separately.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trusted-author-ci-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.repository == 'Sitten-Tokyo/Sippion' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Resolve and revalidate trusted pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid workflow-run head SHA" >&2
            exit 1
          fi

          prs_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/${RUN_HEAD_SHA}/pulls")"

          matching="$(jq -c \
            --arg repository "$REPOSITORY" \
            --arg expected_head_sha "$RUN_HEAD_SHA" '
              [ .[]
                | select(
                    .state == "open"
                    and .draft == false
                    and .base.ref == "main"
                    and .user.login == "Sitten-Tokyo"
                    and .user.type == "User"
                    and .head.repo.full_name == $repository
                    and .head.repo.fork == false
                    and .head.sha == $expected_head_sha
                  )
              ]
            ' <<<"$prs_json")"

          if [[ "$(jq 'length' <<<"$matching")" -ne 1 ]]; then
            echo "Expected exactly one eligible trusted-author PR for $RUN_HEAD_SHA" >&2
            exit 1
          fi

          pr_number="$(jq -r '.[0].number' <<<"$matching")"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number" >&2
            exit 1
          fi

          # Re-read the PR immediately before merge so a stale workflow_run event cannot authorize
          # a newer head, changed base, draft transition, fork, or different author identity.
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          jq -e \
            --arg repository "$REPOSITORY" \
            --arg expected_head_sha "$RUN_HEAD_SHA" '
              .state == "open"
              and .draft == false
              and .base.ref == "main"
              and .user.login == "Sitten-Tokyo"
              and .user.type == "User"
              and .head.repo.full_name == $repository
              and .head.repo.fork == false
              and .head.sha == $expected_head_sha
            ' <<<"$pr_json" >/dev/null

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Squash merge exact CI-verified head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --squash \
            --match-head-commit "$RUN_HEAD_SHA"
