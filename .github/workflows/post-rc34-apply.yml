name: Temporary post-rc34 hardening validation

on:
  push:
    branches:
      - fix/post-rc34-hardening

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: contains(github.event.head_commit.message, 'Run temporary post-rc34 hardening validation')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/post-rc34-hardening

      - name: Apply deterministic hardening patch
        run: |
          python3 scripts/apply_post_rc34_hardening.py
          python3 scripts/apply_post_rc34_deny_fix.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Inventory duplicate dependencies
        run: cargo tree --duplicates

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.18.3 --locked

      - name: Enforce dependency policy
        run: cargo deny check licenses sources bans

      - name: Validate diff
        run: git diff --check

      - name: Commit validated non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock deny.toml src/core.rs src/hybrid.rs src/repo/tests.rs
          git rm scripts/apply_post_rc34_hardening.py scripts/apply_post_rc34_deny_fix.py
          git commit -m 'Harden dependency and Unicode invariants'
          git push origin HEAD:fix/post-rc34-hardening
