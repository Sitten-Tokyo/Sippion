name: Build release artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Source ref to build
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            binary: sippion
            artifact: sippion-linux-x86_64
          - name: Windows x86_64 MSVC
            runner: windows-2025
            binary: sippion.exe
            artifact: sippion-windows-x86_64.exe
          - name: macOS Apple Silicon
            runner: macos-15
            binary: sippion
            artifact: sippion-macos-aarch64
          - name: macOS Intel
            runner: macos-15-intel
            binary: sippion
            artifact: sippion-macos-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --locked

      - name: Stage Unix artifact and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          (
            cd dist
            if [ "$RUNNER_OS" = "macOS" ]; then
              shasum -a 256 "${{ matrix.artifact }}" > SHA256SUMS
            else
              sha256sum "${{ matrix.artifact }}" > SHA256SUMS
            fi
            cp SHA256SUMS "${{ matrix.artifact }}.sha256"
          )

      - name: Stage Windows artifact and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.artifact }}").Hash.ToLowerInvariant()
          "$hash  ${{ matrix.artifact }}" | Set-Content -Encoding ascii dist/SHA256SUMS
          Copy-Item dist/SHA256SUMS "dist/${{ matrix.artifact }}.sha256"

      - name: Attest release binary provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/${{ matrix.artifact }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
