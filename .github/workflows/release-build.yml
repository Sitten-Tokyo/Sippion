name: Build release artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Source ref to build
        required: false
        type: string
        default: ''
      attest:
        description: Issue GitHub build-provenance attestations for distributable release artifacts
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            binary: sippion
            artifact: sippion-linux-x86_64
          - name: Windows x86_64 MSVC
            runner: windows-2025
            binary: sippion.exe
            artifact: sippion-windows-x86_64.exe
          - name: macOS Apple Silicon
            runner: macos-15
            binary: sippion
            artifact: sippion-macos-aarch64
          - name: macOS Intel
            runner: macos-15-intel
            binary: sippion
            artifact: sippion-macos-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --locked

      - name: Stage Unix artifact and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          (
            cd dist
            if [ "$RUNNER_OS" = "macOS" ]; then
              shasum -a 256 "${{ matrix.artifact }}" > SHA256SUMS
            else
              sha256sum "${{ matrix.artifact }}" > SHA256SUMS
            fi
            cp SHA256SUMS "${{ matrix.artifact }}.sha256"
          )

      - name: Stage Windows artifact and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.artifact }}").Hash.ToLowerInvariant()
          "$hash  ${{ matrix.artifact }}" | Set-Content -Encoding ascii dist/SHA256SUMS
          Copy-Item dist/SHA256SUMS "dist/${{ matrix.artifact }}.sha256"

      - name: Attest release binary provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.artifact }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
